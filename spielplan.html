<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Madden Bowl VI — Spielplan</title>
<link rel="icon" type="image/png" href="maddenbowl.ico" />
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Madden Bowl">
<meta name="theme-color" content="#0B162A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared.js"></script>
<script src="tipp.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #22304333; }
  .empty { opacity: 0.6; font-size: 0.9em; }

  /* Playoff-Runden: klar voneinander abgegrenzte Panels statt loser Liste */
  .bracket-session {
    margin-bottom: 16px; padding: 10px 10px 4px; background: rgba(255,255,255,0.025);
    border: 1px solid var(--v2-border, rgba(255,255,255,0.08)); border-radius: 12px;
  }
  .bracket-session:last-child { margin-bottom: 0; }
  .bracket-session h3 {
    color: var(--v2-gold); font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px;
    margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .title-name { width: 110px; font-size: 0.9em; }
  .title-bar-bg { flex: 1; background: #0e1622; border-radius: 6px; overflow: hidden; height: 14px; }
  .title-bar-fill { background: var(--v2-gold); height: 100%; }
  .title-pct { width: 50px; text-align: right; font-size: 0.85em; }
  .btn-secondary { background: transparent; border: 1px solid var(--v2-border); color: var(--v2-silver); border-radius: 6px; padding: 4px 10px; font-size: 0.7em; cursor: pointer; }

  /* Kompakte, klar getrennte Spielzeilen (Regular Season + Playoffs):
     nur Uhrzeit/Ergebnis, Spieler+Team, Spielfeld — Details per Klick. */
  .mb-match-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--v2-border, rgba(255,255,255,0.08));
    border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer;
    transition: background .15s;
  }
  .mb-match-row:last-child { margin-bottom: 0; }
  .mb-match-row:hover, .mb-match-row:active { background: rgba(255,255,255,0.07); }
  .mb-match-row.disabled { cursor: default; opacity: 0.55; }
  .mb-match-row.disabled:hover { background: rgba(255,255,255,0.03); }
  .mb-match-time {
    flex: 0 0 60px; font-size: 0.72em; font-weight: 800; color: var(--v2-gold); text-align: center; line-height: 1.2;
  }
  .mb-match-teams {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: 0.86em; font-weight: 700;
  }
  .mb-team { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
  .mb-team.away { flex-direction: row-reverse; text-align: right; }
  .mb-team .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mb-team img.logo-img { width: 16px; height: 16px; flex: 0 0 auto; }
  .mb-score-or-vs { flex: 0 0 auto; opacity: 0.5; font-size: 0.82em; font-weight: 800; padding: 0 2px; }
  .mb-match-row.played .mb-score-or-vs { opacity: 1; color: var(--v2-gold); font-family: monospace; }
  .mb-match-stadium {
    flex: 0 0 auto; max-width: 84px; font-size: 0.66em; color: var(--v2-silver);
    text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @media (max-width: 420px) {
    .mb-match-stadium { display: none; }
    .mb-match-time { flex-basis: 48px; }
  }

  /* Hinweis im Playoff-Picture-Modal: nur auf schmalen Screens sichtbar,
     da dort Drehen ins Querformat + Zoomen die beste Übersicht gibt. */
  .playoff-picture-hint { display: none; }
  @media (max-width: 700px) {
    .playoff-picture-hint {
      display: block; font-size: 0.78em; opacity: 0.75; margin-bottom: 10px;
      padding: 6px 10px; background: rgba(255,255,255,0.04); border-radius: 8px;
    }
  }
</style>
</head>
<body class="v2">
<div class="v2-wrap wide" id="app">
  <div class="v2-card"><div class="v2-empty">Lade Spielplan…</div></div>
</div>

<div class="v2-modal-overlay" id="playoffPictureModal" onclick="if(event.target===this) closePlayoffPictureModal()">
  <div class="modal-box" id="playoffPictureBox" style="max-width: 900px; width: 96vw; max-height: 92vh; max-height: 92dvh; overflow:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">
      <h2 style="margin:0;">Playoff Picture</h2>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button class="btn-secondary" id="playoffFsBtn" onclick="togglePlayoffFullscreen()">⛶ Vollbild</button>
        <button class="btn-secondary" onclick="closePlayoffPictureModal()">✕ Schließen</button>
      </div>
    </div>
    <div class="playoff-picture-hint">📱 Am Handy am besten quer halten und mit zwei Fingern zoomen/scrollen.</div>
    <div id="playoffPictureModalContent"></div>
  </div>
</div>

<div class="v2-modal-overlay" id="matchDetailModal" onclick="if(event.target===this) closeMatchDetailModal()">
  <div class="v2-modal-box" style="max-width: 420px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px;">
      <h3 style="margin:0; font-size:1em;" id="matchDetailTitle"></h3>
      <button class="btn-secondary" onclick="closeMatchDetailModal()">✕</button>
    </div>
    <div id="matchDetailMeta" style="font-size:0.78em; opacity:0.65; margin-bottom:10px;"></div>
    <div id="matchDetailContent"></div>
  </div>
</div>

<script src="ui.js"></script>
<script>
  MB.UI.mountHeader({ active: 'spielplan' });

  let state = null, history = null, activeTab = 'tabelle';

  // Odds/Titelchance/Insights je Match — 1:1 aus index.html übernommen
  // (dort renderMatchMeta), nutzt dieselben MB.*-Funktionen aus shared.js.
  function renderMatchMeta(homeName, awayName, finished) {
    const H = (homeName || '').trim();
    const A = (awayName || '').trim();
    if (!H || !A || !history) return '';

    let odds;
    try { odds = MB.computeOddsForMatch(history, state, H, A); } catch (e) { odds = null; }
    if (!odds) return '';

    const qHome = MB.decimalOdds(odds.pHome);
    const qAway = MB.decimalOdds(odds.pAway);

    const badges = [
      `Quote: <b>${H}</b> ${qHome} &nbsp;|&nbsp; <b>${A}</b> ${qAway}`,
      `O/U ${odds.ouLine}`,
    ];

    if (!finished) {
      let titleOdds = {};
      try { titleOdds = MB.computeTitleOdds(history, state) || {}; } catch (e) {}
      const tHome = titleOdds[H] || 0;
      const tAway = titleOdds[A] || 0;
      badges.push(
        `🏆 Titelchance: <b>${H}</b> ${tHome.toFixed(1)}% <span style="color:#aaa; font-weight:800;">→ +0.0%</span> &nbsp;|&nbsp; <b>${A}</b> ${tAway.toFixed(1)}% <span style="color:#aaa; font-weight:800;">→ +0.0%</span>`
      );
    }

    const badgeHtml = badges.filter(Boolean).map(b => `
      <div class="badge wide">${b}</div>
    `).join('');

    let insightsSection = '';
    if (!finished) {
      let insightsArr = [];
      try { insightsArr = MB.pickFlavourFacts(history, state, H, A) || []; } catch (e) { insightsArr = []; }
      const insightsHtml = insightsArr.slice(0, 3).map(t => `
        <div style="margin-top:6px; padding:8px 10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-left:3px solid var(--accent); border-radius:8px; font-size:0.78em; line-height:1.25;">${t}</div>
      `).join('');
      insightsSection = insightsHtml ? `<div class="meta-insights">${insightsHtml}</div>` : '';
    }

    return `
      <div class="match-meta">
        <div class="meta-badges">${badgeHtml}</div>
        ${insightsSection}
      </div>`;
  }

  function renderTitleOdds() {
    if (!state.players || !state.players.length) return '<div class="empty">—</div>';
    const odds = MB.computeTitleOdds(history, state);
    const sorted = [...state.players].map(p => ({ name: p.name, pct: odds[p.name] || 0 })).sort((a, b) => b.pct - a.pct);
    const max = Math.max(...sorted.map(x => x.pct), 1);
    return sorted.map(x => `
      <div class="title-row">
        <span class="title-name">${x.name}</span>
        <div class="title-bar-bg"><div class="title-bar-fill" style="width:${(x.pct / max * 100).toFixed(0)}%"></div></div>
        <span class="title-pct">${x.pct.toFixed(1)}%</span>
      </div>`).join('');
  }

  function renderStandings() {
    if (!state.players || !state.players.length) return '<div class="empty">—</div>';
    const sorted = [...state.players].sort((a, b) => {
      if ((b.wins||0) !== (a.wins||0)) return (b.wins||0) - (a.wins||0);
      return (b.diff||0) - (a.diff||0);
    });
    let html = `<table><tr><th>#</th><th>Name</th><th>W-L</th><th>Diff</th></tr>`;
    sorted.forEach((p, i) => {
      html += `<tr><td>${i+1}</td><td style="text-align:left;font-weight:bold;">${p.name}</td><td>${p.wins||0}-${(p.played||0)-(p.wins||0)}</td><td style="color:${(p.diff||0)>0?'var(--accent)':(p.diff||0)<0?'var(--v2-red)':'#eee'}">${(p.diff||0)>0?'+':''}${p.diff||0}</td></tr>`;
    });
    return html + `</table>`;
  }

  // Kompakte Spielzeile: nur Uhrzeit/Ergebnis, Spieler+Team, Spielfeld.
  // Alles Weitere (Quoten, Titelchancen, Insights) gibt's per Klick im
  // Detail-Modal — vorher stand das immer sichtbar unter jeder Partie.
  function renderMatchRow(opts) {
    const { p1Name, p2Name, p1Team, p2Team, played, bye, timeLabel, score, stadium, clickable, onClick } = opts;
    const logo1 = p1Team ? MB.getLogoHtml(p1Team) : '';
    const logo2 = p2Team ? MB.getLogoHtml(p2Team) : '';
    const rowClass = `mb-match-row${played ? ' played' : ''}${clickable === false ? ' disabled' : ''}`;
    const clickAttr = clickable === false ? '' : ` onclick="${onClick}"`;
    const middle = bye ? '—' : (played ? score : 'vs');
    return `
      <div class="${rowClass}"${clickAttr}>
        <div class="mb-match-time">${timeLabel}</div>
        <div class="mb-match-teams">
          <span class="mb-team home">${logo1}<span class="name">${p1Name}</span></span>
          <span class="mb-score-or-vs">${middle}</span>
          <span class="mb-team away">${logo2}<span class="name">${p2Name}</span></span>
        </div>
        ${stadium ? `<div class="mb-match-stadium">${stadium}</div>` : ''}
      </div>`;
  }

  // Speichert die Match-Infos hinterm jeweils zuletzt gerenderten Tab, damit
  // die Klick-Handler der Zeilen (per Index) ohne Quoting-Ärger an
  // openMatchDetail() übergeben werden können.
  let groupDetailRows = [];
  let playoffDetailRows = [];

  function openMatchDetail(p1Name, p2Name, played, metaLine) {
    document.getElementById('matchDetailTitle').textContent = `${p1Name} vs ${p2Name}`;
    document.getElementById('matchDetailMeta').textContent = metaLine || '';
    document.getElementById('matchDetailContent').innerHTML =
      renderMatchMeta(p1Name, p2Name, played) || '<div class="empty">Keine Zusatzinfos verfügbar.</div>';
    document.getElementById('matchDetailModal').classList.add('open');
  }
  function closeMatchDetailModal() { document.getElementById('matchDetailModal').classList.remove('open'); }
  function openGroupMatchDetail(i) {
    const d = groupDetailRows[i];
    if (!d) return;
    openMatchDetail(d.p1Name, d.p2Name, d.played, d.metaLine);
  }
  function openPlayoffMatchDetail(i) {
    const d = playoffDetailRows[i];
    if (!d) return;
    openMatchDetail(d.p1Name, d.p2Name, d.played, d.metaLine);
  }

  function renderGroupSchedule() {
    if (!state.matches || !state.matches.length) return '<div class="empty">Noch kein Spielplan.</div>';
    // Kickoff-Zeiten kommen aus dem LIVE-Zeitplan (verschiebt sich, sobald
    // auf einem Feld Ergebnisse eingetragen werden), Fallback auf die
    // statische Planzeit falls (sollte nicht vorkommen) kein Live-Eintrag da ist.
    const live = MB.computeLiveKickoffSchedule(state);
    groupDetailRows = [];
    return state.matches.map((m, idx) => {
      const p1 = state.players[m.p1], p2 = state.players[m.p2];
      if (!p1 || !p2) return '';
      const played = m.s1 != null && m.s2 != null;
      const liveEntry = live.byMatchId.get(`g-${idx}`);
      const time = liveEntry ? liveEntry.time : MB.getGroupMatchTime(state, m);
      const slot = state.slots.find(s => s.includes(m));
      const idxInSlot = slot ? slot.indexOf(m) : 0;
      const stadium = idxInSlot === 1 ? state.config.s2 : state.config.s1;
      const timeLabel = played ? 'Beendet' : `${time} Uhr`;

      const detailIdx = groupDetailRows.length;
      groupDetailRows.push({ p1Name: p1.name, p2Name: p2.name, played, metaLine: `${timeLabel}${stadium ? ' · ' + stadium : ''}` });

      return renderMatchRow({
        p1Name: p1.name, p2Name: p2.name, p1Team: p1.team, p2Team: p2.team,
        played, timeLabel, score: played ? `${m.s1}:${m.s2}` : null, stadium,
        onClick: `openGroupMatchDetail(${detailIdx})`,
      });
    }).join('');
  }

  function renderBracket() {
    if (!state.playoffMatches || !state.playoffMatches.length) return '<div class="empty">Playoffs noch nicht gestartet.</div>';
    const times = MB.computePlayoffTimes(state);
    const live = MB.computeLiveKickoffSchedule(state);
    playoffDetailRows = [];
    return MB.PLAYOFF_STRUCTURE.map(slotDef => {
      const rows = slotDef.ids.map(id => {
        const m = MB.getPlayoffMatch(state, id);
        const label = MB.playoffLabels[id] || {};
        const bye = m ? MB.isByeMatch(m) : false;
        const p1Name = m?.p1 ? (m.p1.id === -1 ? 'Freilos' : m.p1.name) : (label.p1 || 'TBD');
        const p2Name = m?.p2 ? (m.p2.id === -1 ? 'Freilos' : m.p2.name) : (label.p2 || 'TBD');
        const played = !bye && m && m.s1 != null && m.s2 != null;
        const liveEntry = live.byMatchId.get(`p-${id}`);
        const plannedTime = times.byId[id] || times.groupEndTime;
        const time = liveEntry ? liveEntry.time : plannedTime;
        const timeLabel = bye ? 'Freilos' : (played ? 'Beendet' : `${time} Uhr`);
        const isRealMatchup = m?.p1 && m?.p2 && m.p1.id !== -1 && m.p2.id !== -1;

        const idxInAll = m ? state.playoffMatches.findIndex(x => x.id === id) : -1;
        const stadium = (isRealMatchup && idxInAll >= 0) ? (idxInAll % 2 === 0 ? state.config.s1 : state.config.s2) : null;

        let onClick = null;
        if (isRealMatchup) {
          const detailIdx = playoffDetailRows.length;
          playoffDetailRows.push({ p1Name, p2Name, played, metaLine: `${timeLabel}${stadium ? ' · ' + stadium : ''}` });
          onClick = `openPlayoffMatchDetail(${detailIdx})`;
        }

        return renderMatchRow({
          p1Name, p2Name,
          p1Team: (isRealMatchup && m.p1) ? m.p1.team : null,
          p2Team: (isRealMatchup && m.p2) ? m.p2.team : null,
          played, bye, timeLabel, score: played ? `${m.s1}:${m.s2}` : null, stadium,
          clickable: isRealMatchup, onClick,
        });
      }).join('');
      return `<div class="bracket-session"><h3>${slotDef.session}</h3>${rows}</div>`;
    }).join('');
  }

  function buildPlayoffPictureHtml() {
    const m = state.playoffMatches;
    if (!m || !m.length) return '<div class="empty">Playoffs noch nicht gestartet.</div>';
    const groupEndTime = MB.computePlayoffTimes(state).groupEndTime;
    const liveSchedule = MB.computeLiveKickoffSchedule(state);
    const seedByName = MB.getGroupSeedsFinal(state);
    const playoffLabels = MB.playoffLabels;
    const getSeed = (player) => (player && player.id !== -1) ? (seedByName.get(player.name) || '') : '';

    const formatPlayer = (player, placeholder, isWinner, isLoser, matchId) => {
      if (!player) return `<span style="color:#4a5568">${placeholder}</span>`;
      if (player.id === -1) return 'BYE';
      const seed = `<span style="color:${isWinner ? 'var(--accent)' : '#fff'}; font-weight:bold; margin-right:4px;">[${getSeed(player)}]</span>`;
      const logo = MB.getLogoHtml(player.team);
      const isEndElimination = matchId.startsWith('lb') || matchId === 'ls' || matchId === 'lf' || matchId === 'gf';
      const style = (isLoser && isEndElimination) ? 'text-decoration:line-through; opacity:0.55; filter:grayscale(1);' : '';
      return `<span style="${style}">${seed}${player.name} ${logo || ''}</span>`;
    };

    const renderM = (match, idx, placeholderP1, placeholderP2) => {
      if (!match) return '';
      const bye = MB.isByeMatch(match);
      const active = !bye && match.p1 && match.p2 && match.p2.id !== -1 && !MB.isFinished(match);
      const liveEntry = liveSchedule.byMatchId.get(`p-${match.id}`);
      const time = liveEntry ? liveEntry.time : MB.addMinutes(groupEndTime, match.offset);
      const stadium = (idx % 2 === 0) ? state.config.s1 : state.config.s2;
      const hasScore = match.s1 !== null && match.s2 !== null;
      const w1 = hasScore && match.s1 > match.s2, w2 = hasScore && match.s2 > match.s1;
      const l1 = hasScore && match.s1 < match.s2, l2 = hasScore && match.s2 < match.s1;
      return `
        <div class="bracket-match ${active ? 'match-active' : ''}">
          <div class="bracket-match-header"><span>${match.phase || ''} | ${time}</span><span>${bye ? 'BYE' : (stadium || '')}</span></div>
          <div class="bracket-team ${w2 ? 'winner' : ''}"><span>${formatPlayer(match.p2, placeholderP2, w2, l2, match.id)}</span><span class="bracket-score">${bye ? '—' : (match.s2 !== null ? match.s2 : '')}</span></div>
          <div class="bracket-team ${w1 ? 'winner' : ''}"><span>${formatPlayer(match.p1, placeholderP1, w1, l1, match.id)}</span><span class="bracket-score">${bye ? '—' : (match.s1 !== null ? match.s1 : '')}</span></div>
        </div>`;
    };

    let wcSummaryHtml = '<div class="wildcard-summary">';
    [m[0], m[1], m[2], m[3]].forEach((match, i) => { if (match && match.p1) wcSummaryHtml += renderM(match, i, 'TBD', 'TBD'); });
    wcSummaryHtml += '</div>';

    const findId = (id) => m.find((x) => x.id === id);
    const idxOf = (id) => state.playoffMatches.findIndex((x) => x.id === id);

    return `
      ${wcSummaryHtml}
      <div class="playoff-grid" style="margin-top:14px;">
        <div class="bracket-row-flow">
          <div class="bracket-column">
            <div class="column-header"><div class="bracket-title">Contender Round</div></div>
            <div class="upper-floor">${renderM(m[6], 6, playoffLabels.us1.p1, playoffLabels.us1.p2)}${renderM(m[7], 7, playoffLabels.us2.p1, playoffLabels.us2.p2)}</div>
            <div class="lower-floor">${renderM(m[4], 4, playoffLabels.lb1.p1, playoffLabels.lb1.p2)}${renderM(m[5], 5, playoffLabels.lb2.p1, playoffLabels.lb2.p2)}</div>
          </div>
          <div class="bracket-column">
            <div class="column-header"><div class="bracket-title">Survival Round</div></div>
            <div class="upper-floor"></div>
            <div class="lower-floor">${renderM(m[8], 8, playoffLabels.lb3.p1, playoffLabels.lb3.p2)}${renderM(m[9], 9, playoffLabels.lb4.p1, playoffLabels.lb4.p2)}</div>
          </div>
          <div class="bracket-column">
            <div class="column-header"><div class="bracket-title">Finals</div></div>
            <div class="upper-floor" style="justify-content:center;">${renderM(m[10], 10, playoffLabels.uf.p1, playoffLabels.uf.p2)}</div>
            <div class="lower-floor" style="justify-content:center;">${renderM(m[11], 11, playoffLabels.ls.p1, playoffLabels.ls.p2)}</div>
          </div>
          <div class="bracket-column">
            <div class="column-header"><div class="bracket-title">Judgement Day</div></div>
            <div class="upper-floor"></div>
            <div class="lower-floor" style="justify-content:center;">${renderM(m[12], 12, playoffLabels.lf.p1, playoffLabels.lf.p2)}${renderM(findId('tb'), idxOf('tb'), playoffLabels.tb.p1, playoffLabels.tb.p2)}</div>
          </div>
          <div class="bracket-column" style="margin-left:10px; border-left:2px solid var(--v2-red); padding-left:12px;">
            <div class="column-header"><div class="bracket-title" style="border-color:gold">Madden Bowl</div></div>
            <div class="upper-floor" style="justify-content:center; height:100%;">${renderM(findId('gf'), idxOf('gf'), playoffLabels.gf.p1, playoffLabels.gf.p2)}</div>
          </div>
        </div>
      </div>`;
  }

  function showPlayoffPictureModal() {
    document.getElementById('playoffPictureModalContent').innerHTML = buildPlayoffPictureHtml();
    document.getElementById('playoffPictureModal').classList.add('open');
  }
  function closePlayoffPictureModal() {
    document.getElementById('playoffPictureModal').classList.remove('open');
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    }
  }

  // Echtes Vollbild per Fullscreen-API: blendet auf Android Chrome/Desktop
  // auch die Browser-UI aus. iPhone-Safari unterstützt requestFullscreen für
  // normale Elemente grundsätzlich nicht (Apple-Einschränkung) — der Button
  // wird dort per Feature-Detection gar nicht erst eingeblendet.
  function fullscreenSupported() {
    const el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen);
  }
  function togglePlayoffFullscreen() {
    const box = document.getElementById('playoffPictureBox');
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      (box.requestFullscreen || box.webkitRequestFullscreen)?.call(box);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    }
  }
  function updatePlayoffFsButton() {
    const btn = document.getElementById('playoffFsBtn');
    if (!btn) return;
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    btn.textContent = isFs ? '↙️ Vollbild verlassen' : '⛶ Vollbild';
  }
  document.addEventListener('fullscreenchange', updatePlayoffFsButton);
  document.addEventListener('webkitfullscreenchange', updatePlayoffFsButton);
  if (fullscreenSupported()) {
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('playoffFsBtn');
      if (btn) btn.style.display = 'inline-block';
    });
  }

  function setTab(tab) {
    activeTab = tab;
    // Farbliche Markierung der Reiter selbst aktualisieren — vorher wurde
    // beim Tab-Wechsel nur #mbTabContent neu gerendert, die Tabbar-Buttons
    // (mit ihrer .active-Klasse) blieben dabei unangetastet.
    document.querySelectorAll('#mbTabbar [data-tab]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    renderBody();
  }

  function renderBody() {
    let inner = '';
    if (activeTab === 'tabelle') inner = `<div class="v2-card"><div class="v2-card-title">📊 Tabelle</div>${renderStandings()}</div>`;
    else if (activeTab === 'spielplan') inner = `<div class="v2-card"><div class="v2-card-title">📅 Regular Season</div>${renderGroupSchedule()}</div>`;
    else if (activeTab === 'playoff') inner = `<div class="v2-card"><div class="v2-card-title">🏆 Playoff Picture <button class="btn-secondary" style="margin-left:auto;" onclick="showPlayoffPictureModal()">🖼️ Echtes Bild</button></div>${renderBracket()}</div>`;
    else if (activeTab === 'titel') inner = `<div class="v2-card"><div class="v2-card-title">🎯 Titelchancen</div>${renderTitleOdds()}</div>`;
    document.getElementById('mbTabContent').innerHTML = inner;
  }

  function renderShell() {
    document.getElementById('app').innerHTML = `
      <div class="v2-tabbar" id="mbTabbar">
        <button class="v2-tab ${activeTab==='tabelle'?'active':''}" data-tab="tabelle" onclick="setTab('tabelle')">📊 Tabelle</button>
        <button class="v2-tab ${activeTab==='spielplan'?'active':''}" data-tab="spielplan" onclick="setTab('spielplan')">📅 Regular Season</button>
        <button class="v2-tab ${activeTab==='playoff'?'active':''}" data-tab="playoff" onclick="setTab('playoff')">🏆 Playoffs</button>
        <button class="v2-tab ${activeTab==='titel'?'active':''}" data-tab="titel" onclick="setTab('titel')">🎯 Titelchancen</button>
      </div>
      <div id="mbTabContent"></div>
    `;
    renderBody();
  }

  async function boot() {
    try { state = await MB.fetchCloudState(); } catch (e) {
      document.getElementById('app').innerHTML = `<div class="v2-card">Konnte Turnierdaten nicht laden. (${e.message})</div>`;
      return;
    }
    MB.UI.setState(state);
    if (!state.players || !state.players.length) {
      document.getElementById('app').innerHTML = `<div class="v2-card"><div class="v2-empty">Es läuft aktuell kein Turnier.</div></div>`;
      return;
    }
    try { history = await MB.loadAndBuildHistory(); } catch (e) { console.warn(e); }
    renderShell();
  }

  boot();
</script>
</body>
</html>
