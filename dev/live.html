<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Madden Bowl — Turnierblog</title>
<link rel="icon" type="image/png" href="maddenbowl.ico" />

<!-- PWA: "Zum Home-Bildschirm hinzufügen" (iOS/Android) -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Madden Bowl">
<meta name="theme-color" content="#0b1119">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared.js"></script>
<script src="records.js"></script>
<script src="tipp.js"></script>
<script src="blog.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  /* Seiten-spezifisch: Variablen/Basis-Theme kommen aus styles.css */
  * { box-sizing: border-box; }
  body { padding-bottom: 60px; }
  header {
    padding: 18px 20px; border-bottom: 1px solid #22304366;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(213,10,10,0.08), transparent);
    position: sticky; top: 0; z-index: 10; backdrop-filter: blur(6px);
  }
  header h1 {
    font-size: 1.1em; margin: 0; letter-spacing: 0.5px; text-transform: uppercase;
    background: linear-gradient(90deg, #fff, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .clock { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 0.9em; opacity: 0.9; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }

  /* Modernere Karten-Basis */
  .card {
    border: 1px solid #22304340;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .card h2 { display: flex; align-items: center; gap: 8px; }

  /* HUB: Schnellzugriff-Kacheln (Spielplan/Tippspiel/Shop/Rückblicke) */
  .hub-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 16px;
  }
  .hub-card {
    background: linear-gradient(160deg, #161f2c, #10161f);
    border: 1px solid #22304355; border-radius: 12px;
    padding: 12px 6px; text-align: center; text-decoration: none; color: #eee;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .hub-card:active { transform: scale(0.96); }
  .hub-card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(0,255,204,0.12); }
  .hub-icon { font-size: 1.5em; line-height: 1; margin-bottom: 2px; }
  .hub-title { font-size: 0.72em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; }
  .hub-sub { font-size: 0.62em; opacity: 0.55; }

  /* CURRENT / NEXT — prominente Boxen statt schmalem Ticker */
  .cn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .cn-box {
    background: var(--card); border-radius: 12px; padding: 12px 14px;
    border: 1px solid #22304355; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .cn-box.live { border-color: rgba(213,10,10,0.5); }
  .cn-label {
    font-size: 0.68em; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.65;
    display: flex; align-items: center; gap: 5px; margin-bottom: 8px;
  }
  .cn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--nfl-red); display: inline-block; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .cn-match { font-size: 0.88em; margin-bottom: 8px; }
  .cn-match:last-child { margin-bottom: 0; }
  .cn-teams { font-weight: 700; }
  .cn-meta { font-size: 0.78em; opacity: 0.6; }
  .cn-empty { font-size: 0.82em; opacity: 0.5; }

  /* Skeleton-Loading */
  .skeleton-line {
    height: 12px; border-radius: 6px; margin: 6px 0;
    background: linear-gradient(90deg, #182231 25%, #22304355 50%, #182231 75%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .match-card { background: #0e1622; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .match-top { display: flex; justify-content: space-between; align-items: center; }
  .match-teams { font-weight: bold; font-size: 1.05em; }
  .match-meta { font-size: 0.75em; color: var(--accent); text-align: right; }
  .odds-line { font-size: 0.85em; margin-top: 6px; opacity: 0.9; }
  .facts { margin-top: 8px; font-size: 0.8em; opacity: 0.85; border-left: 2px solid var(--accent); padding-left: 8px; }
  .facts div { margin-bottom: 2px; }
  .title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .title-name { width: 110px; font-size: 0.9em; }
  .title-bar-bg { flex: 1; background: #0e1622; border-radius: 6px; overflow: hidden; height: 14px; }
  .title-bar-fill { background: var(--accent); height: 100%; }
  .title-pct { width: 50px; text-align: right; font-size: 0.85em; }
  .tag-live { background: var(--nfl-red); color: white; font-size: 0.65em; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #22304333; }
  .empty { opacity: 0.6; font-size: 0.9em; }
  .meme-preview-slot { width: 130px; height: 130px; border-radius: 8px; overflow: hidden; background: #000; flex-shrink: 0; }
  .meme-preview-slot img, .meme-preview-slot canvas { width: 100%; height: 100%; object-fit: cover; }
  input, select {
    background: #0e1622; color: #eee; border: 1px solid #2a3a4d; border-radius: 6px;
    padding: 8px 10px; font-size: 0.9em; width: 100%; box-sizing: border-box;
  }
  button {
    background: var(--nfl-red); color: white; border: none; border-radius: 6px;
    padding: 8px 14px; font-weight: bold; cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  button:active { transform: scale(0.97); }
  button:hover { filter: brightness(1.1); }
  .view-toggle { display: flex; justify-content: center; margin: 14px 0; }
  .view-toggle button { width: auto; }
  .article-card {
    background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px;
    border: 1px solid #22304340; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    transition: border-color 0.2s ease;
  }
  .article-card:hover { border-color: #22304380; }
  .article-title { font-weight: 800; font-size: 1.05em; margin-bottom: 6px; }
  .article-body { font-size: 0.92em; line-height: 1.5; opacity: 0.92; white-space: pre-line; }
  .article-time { font-size: 0.72em; opacity: 0.5; margin-top: 8px; }
  .article-media img { width: 100%; border-radius: 8px; margin-top: 10px; }
  .article-media audio { width: 100%; margin-top: 10px; }
  .bracket-session { margin-bottom: 14px; }
  .bracket-session h3 { color: var(--accent); font-size: 0.85em; text-transform: uppercase; margin: 0 0 6px; }
  .bracket-row { display: flex; justify-content: space-between; font-size: 0.88em; padding: 5px 0; border-bottom: 1px solid #22304333; }

  @media (max-width: 420px) {
    .hub-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .hub-title { font-size: 0.62em; }
    .hub-sub { display: none; }
    /* Läuft-gerade / Als-Nächstes bleiben auch auf schmalen Screens
       nebeneinander (spart Höhe) — dafür kompakter statt gestapelt. */
    .cn-grid { gap: 6px; }
    .cn-box { padding: 8px 8px; }
    .cn-label { font-size: 0.62em; margin-bottom: 5px; }
    .cn-match { font-size: 0.76em; margin-bottom: 5px; }
    .cn-meta { font-size: 0.7em; }
  }

  /* Angepinnter Kopfbereich: Hub-Kacheln + "Aktuelles"-Kachel bleiben beim
     Scrollen sichtbar. --header-h wird per JS auf die tatsächliche
     Header-Höhe gesetzt (setHeaderHeightVar). */
  .pinned-top {
    position: sticky; top: var(--header-h, 58px); z-index: 9;
    background: #0b1119; padding-top: 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
  }
  .pinned-top .hub-grid { margin-bottom: 10px; }

  /* AKTUELLES — kompakte Sammel-Kachel: läuft gerade / als Nächstes / Tippspiel-Spitze */
  .aktuelles-card { margin-bottom: 0; padding: 12px 14px; }
  .aktuelles-card h2 { font-size: 0.95em; margin: 0 0 8px; }
  .tipp-top3 {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #22304340;
    display: flex; align-items: center; gap: 8px;
  }
  .tipp-top3-label {
    font-size: 0.62em; text-transform: uppercase; opacity: 0.6; letter-spacing: 0.4px;
    white-space: nowrap;
  }
  .tipp-top3-row { display: flex; flex: 1; gap: 6px; min-width: 0; }
  .tipp-top3-item {
    flex: 1; min-width: 0; text-align: center; background: #0e1622; border-radius: 8px;
    padding: 5px 3px;
  }
  .tipp-top3-item .medal { font-size: 1em; line-height: 1; display: block; }
  .tipp-top3-item .tname {
    display: block; font-weight: 700; font-size: 0.74em; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tipp-top3-item .tpts { display: block; color: var(--accent); font-size: 0.68em; }

  /* POPUP: "echtes" Playoff-Bracket-Bild */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(4,7,12,0.82);
    z-index: 100; padding: 24px 10px; overflow-y: auto;
  }
  .modal-overlay.open { display: block; }
  .modal-box {
    max-width: 1100px; margin: 0 auto; background: var(--card); border: 1px solid #22304355;
    border-radius: 12px; padding: 16px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal-close {
    position: sticky; top: 0; float: right; width: auto; margin-left: 8px;
    background: #22304380; padding: 6px 12px; z-index: 2;
  }
  .modal-box .playoff-grid { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* Eigenständige, in sich geschlossene Bracket-Optik fürs Popup (unabhängig
     von etwaigen Styles aus styles.css), damit das Bild überall gleich aussieht. */
  .modal-box .wildcard-summary { display: grid; gap: 8px; margin-bottom: 4px; }
  .modal-box .bracket-row-flow { display: flex; gap: 14px; min-width: 900px; }
  .modal-box .bracket-column { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 10px; }
  .modal-box .column-header { text-align: center; }
  .modal-box .bracket-title {
    font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.75;
    border-bottom: 1px solid #22304355; padding-bottom: 4px;
  }
  .modal-box .upper-floor, .modal-box .lower-floor { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .modal-box .bracket-match { background: #0e1622; border-radius: 8px; padding: 8px 10px; border: 1px solid #22304340; }
  .modal-box .bracket-match.match-active { border-color: var(--accent); }
  .modal-box .bracket-match-header { display: flex; justify-content: space-between; font-size: 0.62em; opacity: 0.6; margin-bottom: 4px; }
  .modal-box .bracket-team { display: flex; justify-content: space-between; align-items: center; font-size: 0.8em; padding: 2px 0; }
  .modal-box .bracket-team.winner { font-weight: 800; color: var(--accent); }
  .modal-box .bracket-score { font-weight: 700; margin-left: 6px; }
</style>
</head>
<body>

<header>
  <h1>📰 Madden Bowl Blog</h1>
  <span class="clock" id="clock"></span>
</header>

<div class="wrap" id="app"></div>

<!-- Popup: das "echte" grafische Playoff-Bracket (wie im Admin-Tool),
     bei Bedarf aus der textbasierten Playoff-Picture-Karte aufrufbar. -->
<div class="modal-overlay" id="playoffPictureModal" onclick="if(event.target===this) closePlayoffPictureModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closePlayoffPictureModal()">✕ Schließen</button>
    <div id="playoffPictureModalContent"></div>
  </div>
</div>

<script>
  const isAdmin = window.location.search.includes('Altima');
  let state = null;
  let history = null;
  let recordMoments = []; // { id, type, payload, provider, imageUrl, canvasEl, loading, error }
  let articles = [];
  let editingArticleId = null; // Admin: Artikel-ID, die gerade inline bearbeitet wird
  let composingArticle = false; // Admin: "+ Neuer Beitrag"-Formular offen?
  // ?view=full erlaubt einen direkten Link/Tab, der sofort in der
  // Vollansicht startet (z.B. vom "📋 Spielplan"-Hub-Kachel-Link aus).
  let viewMode = new URLSearchParams(location.search).get('view') === 'full' ? 'full' : 'blog';

  function tickClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(tickClock, 1000); tickClock();

  // Angepinnter Kopfbereich (.pinned-top) muss direkt unter dem Header
  // beginnen — Header-Höhe kann je nach Gerät/Schrift leicht variieren,
  // daher per JS gemessen statt hart codiert.
  function setHeaderHeightVar() {
    const header = document.querySelector('header');
    if (header) document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  }
  window.addEventListener('resize', setHeaderHeightVar);
  setHeaderHeightVar();

  // =========================================================
  // HUB: Schnellzugriff-Kacheln, immer sichtbar (auch vor dem Laden)
  // =========================================================
  function renderHubGrid() {
    return `
      <div class="hub-grid">
        <a class="hub-card" href="live.html?view=full" target="_blank">
          <div class="hub-icon">📋</div>
          <div class="hub-title">Spielplan</div>
          <div class="hub-sub">Tabelle & Bracket</div>
        </a>
        <a class="hub-card" href="wettbuero.html">
          <div class="hub-icon">🎯</div>
          <div class="hub-title">Tippspiel</div>
          <div class="hub-sub">Mittippen</div>
        </a>
        <a class="hub-card" href="shop.html">
          <div class="hub-icon">🛍️</div>
          <div class="hub-title">Fan-Shop</div>
          <div class="hub-sub">Merch</div>
        </a>
        <a class="hub-card" href="#articleFeed" onclick="scrollToFeed()">
          <div class="hub-icon">📰</div>
          <div class="hub-title">Blog</div>
          <div class="hub-sub">Alle Artikel</div>
        </a>
      </div>`;
  }

  function scrollToFeed() {
    if (viewMode !== 'blog') { viewMode = 'blog'; render(); }
    setTimeout(() => document.getElementById('articleFeed')?.scrollIntoView({ behavior: 'smooth' }), 50);
  }

  // Sofort sichtbare Grundstruktur (Hub + Platzhalter), bevor überhaupt
  // Daten geladen sind — kein nacktes "Lade..." mehr.
  function renderShell() {
    document.getElementById('app').innerHTML = `
      <div class="pinned-top">
        ${renderHubGrid()}
        <div class="card aktuelles-card">
          <h2>📌 Aktuelles</h2>
          <div class="cn-grid">
            <div class="cn-box"><div class="cn-label">Läuft gerade</div><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:60%"></div></div>
            <div class="cn-box"><div class="cn-label">Als Nächstes</div><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:60%"></div></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="skeleton-line" style="width:50%"></div>
        <div class="skeleton-line" style="width:90%"></div>
        <div class="skeleton-line" style="width:70%"></div>
      </div>
    `;
    setHeaderHeightVar();
  }
  renderShell();

  async function boot() {
    try {
      state = await MB.fetchCloudState();
    } catch (e) {
      document.getElementById('app').innerHTML = `<div class="card empty">Konnte Turnierdaten nicht laden. (${e.message})</div>`;
      return;
    }

    // BUGFIX: Jeder Ladeschritt einzeln abgesichert, statt alles in einem
    // Block — vorher konnte EIN Fehler hier (History/Team-Ratings/Artikel/
    // Rekord-Momente) die Seite für immer auf "Lade Turnierdaten…" hängen
    // lassen, weil render() dann nie erreicht wurde. Jetzt degradiert die
    // Seite bei einem Teilfehler nur das jeweilige Feature, statt komplett
    // hängen zu bleiben.
    try {
      if (!history) history = await MB.loadAndBuildHistory();
    } catch (e) { console.warn('History laden fehlgeschlagen:', e); history = history || { seasons: [], matches: [], byPair: new Map(), byPlayer: new Map(), ringsByPlayer: new Map() }; }

    try {
      await MB.loadTeamRatings(state.config?.year || '2026');
    } catch (e) { console.warn('Team-Ratings laden fehlgeschlagen:', e); }

    try {
      await refreshArticles();
    } catch (e) { console.warn('Artikel laden fehlgeschlagen:', e); }

    if (isAdmin) {
      try { await refreshRecordMoments(); } catch (e) { console.warn('Rekord-Momente laden fehlgeschlagen:', e); }
    }

    try {
      await render();
    } catch (e) {
      console.error('Rendern fehlgeschlagen:', e);
      document.getElementById('app').innerHTML = `<div class="card empty">Fehler beim Anzeigen: ${e.message}. Bitte Seite neu laden.</div>`;
    }

    setInterval(async () => {
      try {
        state = await MB.fetchCloudState();
        await refreshArticles();
        if (isAdmin) await refreshRecordMoments();
        await render();
      } catch (e) { console.warn('Auto-Refresh fehlgeschlagen:', e); }
    }, 15000);
  }

  async function refreshArticles() {
    const tid = MB.getCurrentTournamentId();
    articles = await MB.Blog.fetchArticles(tid, 50);
  }

  function timeAgo(dateStr) {
    const diffMin = Math.round((Date.now() - new Date(dateStr).getTime()) / 60000);
    if (diffMin < 1) return 'gerade eben';
    if (diffMin < 60) return `vor ${diffMin} Min.`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `vor ${diffH} Std.`;
    return new Date(dateStr).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  }

  // =========================================================
  // REKORD-MOMENTE (nur im Admin-Modus, ?Altima) — kommen aus Supabase
  // (von index.html/laptop dorthin geschrieben), hier auf dem Handy
  // direkt teilbar. Meme-Anbieter/Zugangsdaten sind pro Gerät getrennt
  // (eigenes localStorage), unabhängig vom Admin-Laptop.
  // =========================================================
  async function refreshRecordMoments() {
    const tid = MB.getCurrentTournamentId();
    const fresh = await MB.Records.fetchRecordMoments(tid);
    const knownIds = new Set(recordMoments.map(e => e.id));
    fresh.forEach(row => {
      if (knownIds.has(row.id)) return;
      const entry = { id: row.id, record: row.payload, provider: getMemeProvider(), imageUrl: null, canvasEl: null, loading: true, error: null };
      recordMoments.unshift(entry);
      generateMomentVisual(entry).then(render);
    });
    // Von woanders (z.B. index.html) ausgeblendete Momente auch hier entfernen
    const freshIds = new Set(fresh.map(r => r.id));
    recordMoments = recordMoments.filter(e => freshIds.has(e.id));
  }

  function getMemeProvider() { return localStorage.getItem('mb_meme_provider') || 'canvas'; }
  function setMemeProvider(p) { localStorage.setItem('mb_meme_provider', p); render(); }

  async function generateMomentVisual(entry) {
    entry.loading = true; entry.error = null;
    if (entry.provider === 'imgflip') {
      const settings = MB.Records.getImgflipSettings();
      if (!settings.username || !settings.password) {
        entry.error = 'Imgflip nicht eingerichtet (siehe oben).';
        entry.loading = false;
        return;
      }
      try {
        const result = await MB.Records.generateImgflipMeme(entry.record, settings);
        entry.imageUrl = result.url;
      } catch (e) {
        entry.error = 'Imgflip-Fehler: ' + e.message;
      }
    } else {
      const styleId = MB.Records.MEME_STYLES[Math.floor(Math.random() * MB.Records.MEME_STYLES.length)].id;
      entry.styleId = styleId;
      entry.canvasEl = MB.Records.renderMemeCanvas(entry.record, styleId);
    }
    entry.loading = false;
  }

  async function rerollMoment(i) {
    const entry = recordMoments[i];
    entry.provider = getMemeProvider();
    render();
    await generateMomentVisual(entry);
    render();
  }

  async function shareMoment(i) {
    const entry = recordMoments[i];
    const tournamentId = MB.getCurrentTournamentId();
    let mediaUrl = null;

    if (entry.provider === 'imgflip' && entry.imageUrl) {
      const result = await MB.Records.shareOrOpenRemoteImage(entry.imageUrl, `madden-bowl-${entry.record.type}.jpg`);
      if (result === 'opened') alert('Teilen wird von diesem Browser nicht unterstützt — Bild wurde in einem neuen Tab geöffnet.');
      mediaUrl = entry.imageUrl;
    } else if (entry.canvasEl) {
      const fresh = MB.Records.renderMemeCanvas(entry.record, entry.styleId);
      const result = await MB.Records.shareOrDownloadMeme(fresh, `madden-bowl-${entry.record.type}.png`);
      if (result === 'downloaded') alert('Teilen wird von diesem Browser nicht unterstützt — Bild wurde heruntergeladen.');
      try { mediaUrl = await MB.Records.uploadMemeToStorage(fresh, tournamentId, entry.record.type); } catch (e) { console.warn('Meme-Upload für Blog fehlgeschlagen:', e); }
    }

    if (mediaUrl) {
      const article = MB.Blog.buildRecordArticle(entry.record);
      article.media_url = mediaUrl; article.media_type = 'image';
      MB.Blog.pushArticle(tournamentId, article);
      await refreshArticles();
    }
  }

  async function dismissMoment(i) {
    const entry = recordMoments[i];
    await MB.Records.dismissRecordMoment(entry.id);
    recordMoments.splice(i, 1);
    render();
  }

  function renderRecordMoments() {
    const provider = getMemeProvider();
    const imgflipSettings = MB.Records.getImgflipSettings();

    let html = `
      <select onchange="setMemeProvider(this.value)" style="margin-bottom:10px;">
        <option value="canvas" ${provider !== 'imgflip' ? 'selected' : ''}>🎨 Eigene Grafik</option>
        <option value="imgflip" ${provider === 'imgflip' ? 'selected' : ''}>🖼️ Imgflip (echte Vorlagen)</option>
      </select>`;

    if (provider === 'imgflip') {
      html += `
        <div style="margin-bottom:12px;">
          <input type="text" id="imgflipUser" value="${imgflipSettings.username || ''}" placeholder="Imgflip-Username" style="margin-bottom:6px;">
          <input type="password" id="imgflipPass" value="${imgflipSettings.password || ''}" placeholder="Imgflip-Passwort" style="margin-bottom:6px;">
          <button class="btn-secondary" style="width:auto;" onclick="MB.Records.setImgflipSettings({username:document.getElementById('imgflipUser').value.trim(),password:document.getElementById('imgflipPass').value.trim()}); alert('Gespeichert.');">Speichern</button>
        </div>`;
    }

    if (!recordMoments.length) {
      html += `<div class="empty">Noch keine Rekord-Momente in dieser Session.</div>`;
      return html;
    }

    recordMoments.forEach((entry, i) => {
      const info = MB.Records.RECORD_TYPES[entry.record.type] || { label: entry.record.type, emoji: '🏈' };
      let bodyHtml;
      if (entry.loading) {
        bodyHtml = `<div class="empty">Wird generiert…</div>`;
      } else if (entry.error) {
        bodyHtml = `<div class="empty" style="color:var(--nfl-red);">${entry.error}</div>`;
      } else {
        bodyHtml = `
          <div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
            <div class="meme-preview-slot" id="momentPreview-${i}"></div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-self:center;">
              <button class="btn-secondary" style="width:auto;" onclick="rerollMoment(${i})">🔁</button>
              <button style="width:auto;" onclick="shareMoment(${i})">📱 Teilen</button>
              <button class="btn-secondary" style="width:auto;" onclick="dismissMoment(${i})">✕</button>
            </div>
          </div>`;
      }
      html += `<div class="match-card"><div style="font-weight:bold; margin-bottom:8px;">${info.emoji} ${info.label}</div>${bodyHtml}</div>`;
    });

    return html;
  }

  function attachRecordMomentPreviews() {
    recordMoments.forEach((entry, i) => {
      const slot = document.getElementById(`momentPreview-${i}`);
      if (!slot) return;
      slot.innerHTML = '';
      if (entry.provider === 'imgflip' && entry.imageUrl) {
        const img = document.createElement('img');
        img.src = entry.imageUrl;
        slot.appendChild(img);
      } else if (entry.canvasEl) {
        slot.appendChild(entry.canvasEl);
      }
    });
  }

  // Zentral aus shared.js (MB.getUpcomingMatches) — dieselbe Quelle wie
  // index.html (Next-Games/Ansage) und wettbuero.html (wettbare Spiele).
  function getUpcomingWithFacts(limit) {
    return MB.getUpcomingMatches(state, { limit });
  }

  function renderMatches() {
    const upcoming = getUpcomingWithFacts(4);
    if (!upcoming.length) return `<div class="empty">Aktuell keine offenen Spiele.</div>`;

    return upcoming.map((m, i) => {
      const odds = MB.computeOddsForMatch(history, state, m.homeName, m.awayName);
      const qHome = MB.decimalOdds(odds.pHome), qAway = MB.decimalOdds(odds.pAway);
      const facts = MB.pickFlavourFacts(history, state, m.homeName, m.awayName);
      return `
        <div class="match-card">
          <div class="match-top">
            <span class="match-teams">${m.awayName} @ ${m.homeName} ${i < 2 ? '<span class="tag-live">Next</span>' : ''}</span>
            <span class="match-meta">${m.phase || ''}<br>${m.time} Uhr · ${m.stadium || ''}</span>
          </div>
          <div class="odds-line">Quote: <b>${m.homeName}</b> ${qHome} &nbsp;|&nbsp; <b>${m.awayName}</b> ${qAway} &nbsp;|&nbsp; O/U ${odds.ouLine}</div>
          ${facts.length ? `<div class="facts">${facts.map(f => `<div>💬 ${f}</div>`).join('')}</div>` : ''}
        </div>`;
    }).join('');
  }

  function renderTitleOdds() {
    if (!state.players || !state.players.length) return '<div class="empty">—</div>';
    const odds = MB.computeTitleOdds(history, state);
    const sorted = [...state.players].map(p => ({ name: p.name, pct: odds[p.name] || 0 })).sort((a, b) => b.pct - a.pct);
    const max = Math.max(...sorted.map(x => x.pct), 1);
    return sorted.map(x => `
      <div class="title-row">
        <span class="title-name">${x.name}</span>
        <div class="title-bar-bg"><div class="title-bar-fill" style="width:${(x.pct / max * 100).toFixed(0)}%"></div></div>
        <span class="title-pct">${x.pct.toFixed(1)}%</span>
      </div>`).join('');
  }

  function renderStandings() {
    if (!state.players || !state.players.length) return '<div class="empty">—</div>';
    const sorted = [...state.players].sort((a, b) => {
      if ((b.wins||0) !== (a.wins||0)) return (b.wins||0) - (a.wins||0);
      return (b.diff||0) - (a.diff||0);
    });
    let html = `<table><tr><th>#</th><th>Name</th><th>W-L</th><th>Diff</th></tr>`;
    sorted.forEach((p, i) => {
      html += `<tr><td>${i+1}</td><td style="text-align:left;font-weight:bold;">${p.name}</td><td>${p.wins||0}-${(p.played||0)-(p.wins||0)}</td><td style="color:${(p.diff||0)>0?'var(--accent)':(p.diff||0)<0?'var(--nfl-red)':'#eee'}">${(p.diff||0)>0?'+':''}${p.diff||0}</td></tr>`;
    });
    return html + `</table>`;
  }

  // =========================================================
  // CURRENT / NEXT — "läuft gerade" (Anpfiff schon vorbei, kein Ergebnis
  // eingetragen) vs. "als Nächstes" (Anpfiff noch nicht erreicht)
  // =========================================================
  function getLastResults(limit) {
    const all = MB.getCurrentMatchesNormalized(state);
    return all.slice(-limit).reverse();
  }

  function nowTimeStr() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function renderCurrentNextInner() {
    const upcoming = MB.getUpcomingMatches(state, { limit: 6 });
    const now = nowTimeStr();
    const live = upcoming.filter(m => m.time && m.time <= now).slice(0, 2);
    const next = upcoming.filter(m => !m.time || m.time > now).slice(0, 2);

    const liveHtml = live.length
      ? live.map(m => `
          <div class="cn-match">
            <div class="cn-teams">${m.awayName} @ ${m.homeName}</div>
            <div class="cn-meta">seit ${m.time} Uhr</div>
          </div>`).join('')
      : `<div class="cn-empty">Gerade läuft nichts.</div>`;

    const nextHtml = next.length
      ? next.map(m => `
          <div class="cn-match">
            <div class="cn-teams">${m.awayName} @ ${m.homeName}</div>
            <div class="cn-meta">${m.time || '?'} Uhr</div>
          </div>`).join('')
      : `<div class="cn-empty">Keine weiteren Spiele geplant.</div>`;

    return `
      <div class="cn-grid">
        <div class="cn-box ${live.length ? 'live' : ''}">
          <div class="cn-label">${live.length ? '<span class="cn-dot"></span>' : ''}Läuft gerade</div>
          ${liveHtml}
        </div>
        <div class="cn-box">
          <div class="cn-label">Als Nächstes</div>
          ${nextHtml}
        </div>
      </div>`;
  }

  // Kompakte Top-3-Zeile fürs Tippspiel, für die angepinnte "Aktuelles"-Kachel.
  // Nutzt dieselbe Quelle wie die volle Tippstand-Tabelle (MB.Tipp).
  async function renderTippTop3Html() {
    const tid = MB.getCurrentTournamentId();
    if (!tid) return '';
    try {
      const allPicks = await MB.Tipp.fetchAllPicks(tid);
      const ouLines = await MB.Tipp.fetchAllOuLines(tid);
      const standings = MB.Tipp.computeTippStandings(state, allPicks, ouLines);
      if (!standings.length) return '';
      const medals = ['🥇', '🥈', '🥉'];
      const top3 = standings.slice(0, 3)
        .map((row, i) => `
          <div class="tipp-top3-item">
            <span class="medal">${medals[i]}</span>
            <span class="tname">${row.name}</span>
            <span class="tpts">${row.points} P</span>
          </div>`)
        .join('');
      return `<div class="tipp-top3"><span class="tipp-top3-label">🎯 Tippspiel</span><div class="tipp-top3-row">${top3}</div></div>`;
    } catch (e) {
      console.warn('Tippspiel-Top3 laden fehlgeschlagen:', e);
      return '';
    }
  }

  // Angepinnte Sammel-Kachel: aktuelle & kommende Spiele + Tippspiel-Spitze,
  // platzsparend an einem Ort statt über mehrere Karten verteilt.
  async function renderAktuellesCard() {
    const top3Html = await renderTippTop3Html();
    return `
      <div class="card aktuelles-card">
        <h2>📌 Aktuelles</h2>
        ${renderCurrentNextInner()}
        ${top3Html}
      </div>`;
  }

  // =========================================================
  // VOLLANSICHT: Tabelle + Gruppenspielplan + Playoff-Bracket
  // (rein lesend, keine Admin-Funktionen)
  // =========================================================
  function renderGroupSchedule() {
    if (!state.matches || !state.matches.length) return '<div class="empty">Noch kein Spielplan.</div>';
    return state.matches.map(m => {
      const p1 = state.players[m.p1], p2 = state.players[m.p2];
      if (!p1 || !p2) return '';
      const played = m.s1 != null && m.s2 != null;
      const time = MB.getGroupMatchTime(state, m);
      return `<div class="bracket-row"><span>${p1.name} vs ${p2.name}</span><span>${played ? `${m.s1}:${m.s2}` : `${time} Uhr`}</span></div>`;
    }).join('');
  }

  function renderBracket() {
    if (!state.playoffMatches || !state.playoffMatches.length) return '<div class="empty">Playoffs noch nicht gestartet.</div>';
    const times = MB.computePlayoffTimes(state);
    return MB.PLAYOFF_STRUCTURE.map(slotDef => {
      const rows = slotDef.ids.map(id => {
        const m = MB.getPlayoffMatch(state, id);
        const label = MB.playoffLabels[id] || {};
        const p1Name = m?.p1 ? (m.p1.id === -1 ? 'Freilos' : m.p1.name) : (label.p1 || 'TBD');
        const p2Name = m?.p2 ? (m.p2.id === -1 ? 'Freilos' : m.p2.name) : (label.p2 || 'TBD');
        const played = m && m.s1 != null && m.s2 != null;
        const right = played ? `${m.s1}:${m.s2}` : `${times.byId[id] || times.groupEndTime} Uhr`;
        return `<div class="bracket-row"><span>${p1Name} vs ${p2Name}</span><span>${right}</span></div>`;
      }).join('');
      return `<div class="bracket-session"><h3>${slotDef.session}</h3>${rows}</div>`;
    }).join('');
  }

  // =========================================================
  // "ECHTES" PLAYOFF-BRACKET-BILD (Popup) — visuelle Grafik-Variante wie im
  // Admin-Tool (index.html), hier als eigenständiges, in sich geschlossenes
  // Markup (siehe .modal-box-Styles) statt der textlichen Zeilenliste aus
  // renderBracket(). Nutzt nur zentrale MB-Funktionen aus shared.js, damit
  // Reihenfolge/Seeds/Zeiten exakt mit dem Rest der Seite übereinstimmen.
  // =========================================================
  function buildPlayoffPictureHtml() {
    const m = state.playoffMatches;
    if (!m || !m.length) return '<div class="empty">Playoffs noch nicht gestartet.</div>';

    const groupEndTime = MB.computePlayoffTimes(state).groupEndTime;
    const seedByName = MB.getGroupSeedsFinal(state);
    const playoffLabels = MB.playoffLabels;
    const getSeed = (player) => (player && player.id !== -1) ? (seedByName.get(player.name) || '') : '';

    const formatPlayer = (player, placeholder, isWinner, isLoser, matchId) => {
      if (!player) return `<span style="color:#4a5568">${placeholder}</span>`;
      if (player.id === -1) return 'BYE';
      const seed = `<span style="color:${isWinner ? 'var(--accent)' : '#fff'}; font-weight:bold; margin-right:4px;">[${getSeed(player)}]</span>`;
      const logo = MB.getLogoHtml(player.team);
      const isEndElimination = matchId.startsWith('lb') || matchId === 'ls' || matchId === 'lf' || matchId === 'gf';
      const style = (isLoser && isEndElimination) ? 'text-decoration:line-through; opacity:0.55; filter:grayscale(1);' : '';
      return `<span style="${style}">${seed}${player.name} ${logo || ''}</span>`;
    };

    const renderM = (match, idx, placeholderP1, placeholderP2) => {
      if (!match) return '';
      const bye = MB.isByeMatch(match);
      const active = !bye && match.p1 && match.p2 && match.p2.id !== -1 && !MB.isFinished(match);
      const time = MB.addMinutes(groupEndTime, match.offset);
      const stadium = (idx % 2 === 0) ? state.config.s1 : state.config.s2;
      const hasScore = match.s1 !== null && match.s2 !== null;
      const w1 = hasScore && match.s1 > match.s2, w2 = hasScore && match.s2 > match.s1;
      const l1 = hasScore && match.s1 < match.s2, l2 = hasScore && match.s2 < match.s1;
      return `
        <div class="bracket-match ${active ? 'match-active' : ''}">
          <div class="bracket-match-header"><span>${match.phase || ''} | ${time}</span><span>${bye ? 'BYE' : (stadium || '')}</span></div>
          <div class="bracket-team ${w2 ? 'winner' : ''}"><span>${formatPlayer(match.p2, placeholderP2, w2, l2, match.id)}</span><span class="bracket-score">${bye ? '—' : (match.s2 !== null ? match.s2 : '')}</span></div>
          <div class="bracket-team ${w1 ? 'winner' : ''}"><span>${formatPlayer(match.p1, placeholderP1, w1, l1, match.id)}</span><span class="bracket-score">${bye ? '—' : (match.s1 !== null ? match.s1 : '')}</span></div>
        </div>`;
    };

    let wcSummaryHtml = '<div class="wildcard-summary">';
    [m[0], m[1], m[2], m[3]].forEach((match, i) => {
      if (!match || !match.p1) return;
      wcSummaryHtml += renderM(match, i, 'TBD', 'TBD');
    });
    wcSummaryHtml += '</div>';

    const findId = (id) => m.find((x) => x.id === id);
    const idxOf = (id) => state.playoffMatches.findIndex((x) => x.id === id);

    return `
      ${wcSummaryHtml}
      <div class="playoff-grid" style="margin-top:14px;">
        <div class="bracket-row-flow">
          <div class="bracket-column">
            <div class="column-header"><div class="bracket-title">Contender Round</div></div>
            <div class="upper-floor">${renderM(m[6], 6, playoffLabels.us1.p1, playoffLabels.us1.p2)}${renderM(m[7], 7, playoffLabels.us2.p1, playoffLabels.us2.p2)}</div>
            <div class="lower-floor">${renderM(m[4], 4, playoffLabels.lb1.p1, playoffLabels.lb1.p2)}${renderM(m[5], 5, playoffLabels.lb2.p1, playoffLabels.lb2.p2)}</div>
          </div>
          <div class="bracket-column">
            <div class="column-header"><div class="bracket-title">Survival Round</div></div>
            <div class="upper-floor"></div>
            <div class="lower-floor">${renderM(m[8], 8, playoffLabels.lb3.p1, playoffLabels.lb3.p2)}${renderM(m[9], 9, playoffLabels.lb4.p1, playoffLabels.lb4.p2)}</div>
          </div>
          <div class="bracket-column">
            <div class="column-header"><div class="bracket-title">Finals</div></div>
            <div class="upper-floor" style="justify-content:center;">${renderM(m[10], 10, playoffLabels.uf.p1, playoffLabels.uf.p2)}</div>
            <div class="lower-floor" style="justify-content:center;">${renderM(m[11], 11, playoffLabels.ls.p1, playoffLabels.ls.p2)}</div>
          </div>
          <div class="bracket-column">
            <div class="column-header"><div class="bracket-title">Judgement Day</div></div>
            <div class="upper-floor"></div>
            <div class="lower-floor" style="justify-content:center;">${renderM(m[12], 12, playoffLabels.lf.p1, playoffLabels.lf.p2)}${renderM(findId('tb'), idxOf('tb'), playoffLabels.tb.p1, playoffLabels.tb.p2)}</div>
          </div>
          <div class="bracket-column" style="margin-left:10px; border-left:2px solid var(--nfl-red); padding-left:12px;">
            <div class="column-header"><div class="bracket-title" style="border-color:gold">Madden Bowl</div></div>
            <div class="upper-floor" style="justify-content:center; height:100%;">${renderM(findId('gf'), idxOf('gf'), playoffLabels.gf.p1, playoffLabels.gf.p2)}</div>
          </div>
        </div>
      </div>`;
  }

  function showPlayoffPictureModal() {
    document.getElementById('playoffPictureModalContent').innerHTML = buildPlayoffPictureHtml();
    document.getElementById('playoffPictureModal').classList.add('open');
  }

  function closePlayoffPictureModal() {
    document.getElementById('playoffPictureModal').classList.remove('open');
  }

  async function renderTippStandingsHtml() {
    const tid = MB.getCurrentTournamentId();
    if (!tid) return '<div class="empty">Kein Turnier aktiv.</div>';
    const allPicks = await MB.Tipp.fetchAllPicks(tid);
    const ouLines = await MB.Tipp.fetchAllOuLines(tid);
    const standings = MB.Tipp.computeTippStandings(state, allPicks, ouLines);
    if (!standings.length) return '<div class="empty">Noch keine Tipps abgegeben.</div>';
    return standings.map((row, i) => `<div class="bracket-row"><span>${i + 1}. ${row.name}</span><span>${row.points} P</span></div>`).join('');
  }

  async function renderFullView() {
    return `
      <div class="card"><h2>Aktuelle & kommende Spiele</h2>${renderMatches()}</div>
      <div class="card"><h2>🏈 Tippstand</h2>${await renderTippStandingsHtml()}
        <div class="hint" style="margin-top:8px;">Mittippen: <a href="wettbuero.html" style="color:var(--accent);">wettbuero.html</a></div>
      </div>
      <div class="card"><h2>Tabelle</h2>${renderStandings()}</div>
      <div class="card"><h2>Gruppenspielplan</h2>${renderGroupSchedule()}</div>
      <div class="card"><h2>Playoff Picture <button class="btn-secondary" style="width:auto; float:right; font-size:0.7em; padding:4px 10px;" onclick="showPlayoffPictureModal()">🖼️ Echtes Bild</button></h2>${renderBracket()}</div>
      <div class="card"><h2>Titelchancen</h2>${renderTitleOdds()}</div>
    `;
  }

  // =========================================================
  // ARTIKEL-FEED (Turnierblog)
  // -------------------------------------------------------
  // Im Admin-Modus (?Altima) kann hier zusätzlich manuell ein Beitrag
  // verfasst sowie jeder bestehende Artikel bearbeitet oder gelöscht werden
  // (siehe submitNewArticle/saveArticleEdit/deleteArticleConfirm unten).
  // =========================================================
  function renderComposeBox() {
    if (!isAdmin) return '';
    if (!composingArticle) {
      return `<div class="card" style="margin-bottom:14px;"><button class="btn-secondary" onclick="composingArticle=true; render();">✍️ Neuer Beitrag</button></div>`;
    }
    return `
      <div class="card" style="margin-bottom:14px;">
        <div style="font-weight:bold; margin-bottom:8px;">✍️ Neuer Beitrag</div>
        <input type="text" id="newArticleTitle" placeholder="Titel" style="width:100%; box-sizing:border-box; margin-bottom:8px;">
        <textarea id="newArticleBody" rows="5" placeholder="Text" style="width:100%; box-sizing:border-box;"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button onclick="submitNewArticle()">Veröffentlichen</button>
          <button class="btn-secondary" onclick="composingArticle=false; render();">Abbrechen</button>
        </div>
      </div>`;
  }

  function renderArticleFeed() {
    const compose = renderComposeBox();
    if (!articles.length) {
      return compose + `<div id="articleFeed" class="card empty">Noch keine Artikel — die ersten erscheinen, sobald das Turnier läuft.</div>`;
    }
    return compose + `<div id="articleFeed">` + articles.map(a => {
      if (isAdmin && editingArticleId === a.id) {
        return `
          <div class="article-card">
            <input type="text" id="editTitle-${a.id}" value="${String(a.title || '').replace(/"/g, '&quot;')}" style="width:100%; box-sizing:border-box; margin-bottom:8px;">
            <textarea id="editBody-${a.id}" rows="5" style="width:100%; box-sizing:border-box;">${a.body || ''}</textarea>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button onclick="saveArticleEdit('${a.id}')">Speichern</button>
              <button class="btn-secondary" onclick="editingArticleId=null; render();">Abbrechen</button>
            </div>
          </div>`;
      }
      return `
      <div class="article-card">
        <div class="article-title">${a.title}</div>
        <div class="article-body">${a.body}</div>
        ${a.media_type === 'audio' ? `<div class="article-media"><audio controls src="${a.media_url}"></audio></div>` : ''}
        ${a.media_type === 'image' ? `<div class="article-media"><img src="${a.media_url}"></div>` : ''}
        <div class="article-time">${timeAgo(a.created_at)}</div>
        ${isAdmin ? `
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn-secondary" style="width:auto; font-size:0.8em; padding:3px 8px;" onclick="editingArticleId='${a.id}'; render();">✏️ Bearbeiten</button>
            <button class="btn-secondary" style="width:auto; font-size:0.8em; padding:3px 8px;" onclick="deleteArticleConfirm('${a.id}')">🗑️ Löschen</button>
          </div>` : ''}
      </div>`;
    }).join('') + `</div>`;
  }

  async function submitNewArticle() {
    const titleEl = document.getElementById('newArticleTitle');
    const bodyEl = document.getElementById('newArticleBody');
    const title = titleEl.value.trim(), body = bodyEl.value.trim();
    if (!title || !body) { alert('Bitte Titel und Text ausfüllen.'); return; }
    const tid = MB.getCurrentTournamentId();
    if (!tid) { alert('Kein aktives Turnier — Artikel kann gerade nicht gespeichert werden.'); return; }
    const created = await MB.Blog.pushManualArticle(tid, { title, body });
    if (created) articles.unshift(created);
    else alert('Speichern fehlgeschlagen — siehe Konsole.');
    composingArticle = false;
    render();
  }

  async function saveArticleEdit(id) {
    const title = document.getElementById(`editTitle-${id}`).value.trim();
    const body = document.getElementById(`editBody-${id}`).value.trim();
    if (!title || !body) { alert('Bitte Titel und Text ausfüllen.'); return; }
    const updated = await MB.Blog.updateArticle(id, { title, body });
    if (updated) {
      const idx = articles.findIndex(a => a.id === id);
      if (idx >= 0) articles[idx] = updated;
    } else {
      alert('Speichern fehlgeschlagen — siehe Konsole.');
    }
    editingArticleId = null;
    render();
  }

  async function deleteArticleConfirm(id) {
    if (!confirm('Diesen Artikel wirklich löschen? Das lässt sich nicht rückgängig machen.')) return;
    const ok = await MB.Blog.deleteArticle(id);
    if (ok) articles = articles.filter(a => a.id !== id);
    else alert('Löschen fehlgeschlagen — siehe Konsole.');
    render();
  }

  function toggleView() {
    viewMode = viewMode === 'blog' ? 'full' : 'blog';
    render();
  }

  async function render() {
    const app = document.getElementById('app');
    if (!state.players || state.players.length === 0) {
      app.innerHTML = `<div class="pinned-top">${renderHubGrid()}</div><div class="card empty">Es läuft aktuell kein Turnier.</div>`;
      setHeaderHeightVar();
      return;
    }
    const mainContent = viewMode === 'full' ? await renderFullView() : renderArticleFeed();
    const aktuellesHtml = await renderAktuellesCard();
    app.innerHTML = `
      <div class="pinned-top">
        ${renderHubGrid()}
        ${aktuellesHtml}
      </div>
      ${isAdmin ? `<div class="card"><h2>🏆 Rekord-Momente (Admin)</h2>${renderRecordMoments()}</div>` : ''}
      <div class="view-toggle">
        <button class="btn-secondary" onclick="toggleView()">${viewMode === 'blog' ? '📊 Volle Turnieransicht' : '📰 Zurück zum Blog'}</button>
      </div>
      ${mainContent}
    `;
    setHeaderHeightVar();
    if (isAdmin) attachRecordMomentPreviews();
  }

  boot();
</script>
</body>
</html>
