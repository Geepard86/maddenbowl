<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Madden Bowl — Hall of Fame</title>
<link rel="icon" type="image/png" href="maddenbowl.ico" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared.js"></script>
<script src="nav.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  * { box-sizing: border-box; }
  body { padding-bottom: 40px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { border: 1px solid #22304340; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }

  .hof-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .hof-tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px; cursor: pointer;
    background: var(--card); border: 1px solid #22304355; font-weight: 800; font-size: 0.85em;
    text-transform: uppercase; letter-spacing: 0.4px; color: #9db3c8;
  }
  .hof-tab.active { color: var(--accent); border-color: var(--accent); background: rgba(0,255,204,0.08); }

  .rank-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px;
    background: #0e1622; margin-bottom: 8px; border: 1px solid #22304340;
  }
  .rank-row.top1 { border-color: gold; background: linear-gradient(90deg, rgba(255,215,0,0.10), transparent); }
  .rank-row.top2 { border-color: silver; }
  .rank-row.top3 { border-color: #cd7f32; }
  .rank-medal { width: 28px; text-align: center; font-size: 1.2em; flex-shrink: 0; }
  .rank-name { flex: 1; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-sub { font-size: 0.72em; opacity: 0.6; }
  .rank-pts { color: var(--accent); font-weight: 800; font-size: 0.95em; white-space: nowrap; }

  .record-card {
    background: var(--card); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    border: 1px solid #22304340; display: flex; align-items: center; gap: 12px;
  }
  .record-icon { font-size: 1.6em; flex-shrink: 0; }
  .record-title { font-weight: 800; font-size: 0.9em; }
  .record-detail { font-size: 0.8em; opacity: 0.75; margin-top: 2px; }
  .empty { opacity: 0.6; font-size: 0.9em; }
</style>
</head>
<body>

<header></header>

<div class="wrap" id="app">
  <div class="card"><div class="empty">Lade Hall of Fame …</div></div>
</div>

<script>
  MB.Nav.mount({ current: 'hof', title: 'Madden Bowl', subtitle: 'Hall of Fame' });

  let activeTab = 'ewig'; // 'ewig' | 'rekorde'
  let allTime = [];   // [{ name, points, championships, podiums, seasons }]
  let records = [];   // [{ icon, title, detail }]

  function renderAllTimeTable() {
    if (!allTime.length) return '<div class="card empty">Noch keine abgeschlossenen Saisons.</div>';
    return `<div class="card">` + allTime.map((p, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
      return `
        <div class="rank-row ${i < 3 ? 'top' + (i + 1) : ''}">
          <div class="rank-medal">${medal}</div>
          <div>
            <div class="rank-name">${p.name}</div>
            <div class="rank-sub">${p.seasons} Saison${p.seasons === 1 ? '' : 'en'} · ${p.championships} 👑${p.podiums} 🏅</div>
          </div>
          <div class="rank-pts" style="margin-left:auto;">${p.points} Pkt.</div>
        </div>`;
    }).join('') + `</div>`;
  }

  function renderRecords() {
    if (!records.length) return '<div class="card empty">Noch keine Rekorde erfasst.</div>';
    return records.map(r => `
      <div class="record-card">
        <div class="record-icon">${r.icon}</div>
        <div>
          <div class="record-title">${r.title}</div>
          <div class="record-detail">${r.detail}</div>
        </div>
      </div>`).join('');
  }

  function setTab(tab) { activeTab = tab; render(); }

  function render() {
    document.getElementById('app').innerHTML = `
      <div class="hof-tabs">
        <div class="hof-tab ${activeTab === 'ewig' ? 'active' : ''}" onclick="setTab('ewig')">🏆 Ewige Tabelle</div>
        <div class="hof-tab ${activeTab === 'rekorde' ? 'active' : ''}" onclick="setTab('rekorde')">📊 Neueste Rekorde</div>
      </div>
      ${activeTab === 'ewig' ? renderAllTimeTable() : renderRecords()}
    `;
  }

  async function boot() {
    try {
      const raw = await MB.loadHistorySeasons();
      const built = MB.computeHallOfFameSummary(raw || []);
      allTime = built.allTime;
      records = built.records;
    } catch (e) {
      console.warn('Hall of Fame laden fehlgeschlagen:', e);
    }
    render();
    try {
      const state = await MB.fetchCloudState();
      MB.Nav.refreshAuth(state);
    } catch (e) { /* egal, HOF braucht kein aktives Turnier */ }
  }

  boot();
</script>
</body>
</html>
