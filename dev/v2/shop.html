<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Madden Bowl — Fan-Shop</title>
<link rel="icon" type="image/png" href="maddenbowl.ico" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { padding: 16px; }
  header { padding: 12px 4px 16px; border-bottom: 1px solid #22304366; margin-bottom: 16px; max-width: 900px; margin-left: auto; margin-right: auto; }
  header h1 { margin: 0; font-size: 1.15em; text-transform: uppercase; letter-spacing: 0.5px; }
  header a { color: var(--accent); font-size: 0.85em; text-decoration: none; }
  #myShop { max-width: 900px; margin: 0 auto; }
</style>
</head>
<body>

<header>
  <h1>🛍️ Madden Bowl Fan-Shop</h1>
  <div style="margin-top:6px;"><a href="live.html">← Zurück zum Turnierblog</a></div>
</header>

<!-- Spreadshop-Einbindung. WICHTIG: baseId ("myShop") muss exakt zur ID
     dieses div passen, sonst rendert der Shop nichts hinein. -->
<div id="myShop">
  <a href="https://maddenbowl.myspreadshop.de">MaddenBowl</a>
</div>
<script>
  /*
   * Deep-Link-Unterstützung
   *
   * Produktkarten auf der Dashboard-Seite verlinken z.B. auf:
   *   shop.html#!/articles/T2372...
   *
   * Spreadshop verwendet bei eingebetteten Shops Hashbang-Routen.
   * Für die JS-Integration erwartet startToken den Pfad OHNE "#!/".
   */
  var incomingHash = window.location.hash || '';
  var startToken = '';

  if (incomingHash.indexOf('#!/') === 0) {
    startToken = incomingHash.substring(3);
  }

  var spread_shop_config = {
    shopName: 'maddenbowl',
    locale: 'de_DE',
    prefix: 'https://maddenbowl.myspreadshop.de',
    baseId: 'myShop',
    startToken: startToken || undefined,
    updateMetadata: false
  };

  // FALLBACK:
  // Falls das Spreadshop-Widget nicht geladen werden kann, wird der Shop
  // weiterhin per iframe eingebettet. Auch dabei wird der Deep-Link erhalten.
  var shopEmbedded = false;

  function embedShopFallback() {
    if (shopEmbedded) return;
    shopEmbedded = true;

    var el = document.getElementById('myShop');
    if (!el) return;

    var iframe = document.createElement('iframe');

    // Beispiel:
    // shop.html#!/articles/ABC
    // ->
    // https://maddenbowl.myspreadshop.de#!/articles/ABC
    iframe.src = spread_shop_config.prefix + incomingHash;

    iframe.title = 'Madden Bowl Fan-Shop';
    iframe.loading = 'lazy';
    iframe.style.cssText =
      'width:100%; min-height:80vh; border:0; border-radius:8px; display:block;';

    el.innerHTML = '';
    el.appendChild(iframe);
  }

  var shopFallbackTimer = setTimeout(function () {
    var el = document.getElementById('myShop');

    // Wenn das Widget erfolgreich geladen hat, hat es den Platzhalter-Link
    // bereits ersetzt. Dann nichts weiter tun.
    if (el && el.querySelector('a[href="' + spread_shop_config.prefix + '"]')) {
      embedShopFallback();
    }
  }, 4000);
</script>
<script type="text/javascript"
        src="https://maddenbowl.myspreadshop.de/shopfiles/shopclient/shopclient.nocache.js"
        onerror="clearTimeout(shopFallbackTimer); embedShopFallback();">
</script>

</body>
</html>
