<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Madden Bowl VI — Blog</title>
<link rel="icon" type="image/png" href="maddenbowl.ico" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared.js"></script>
<script src="tipp.js"></script>
<script src="blog.js"></script>
<script src="ui.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  .v2-blog-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .v2-blog-header img.crown { width:26px; height:26px; }
  .v2-blog-header h1 { font-size:1.3em; margin:0; }
  .v2-blog-header .sub { font-size:0.62em; letter-spacing:2px; text-transform:uppercase; color:var(--v2-silver); margin-top:2px; }
  .v2-article { display:flex; gap:12px; background:var(--v2-surface); border:1px solid var(--v2-border); border-radius:12px; padding:10px; margin-bottom:10px; text-decoration:none; color:inherit; align-items:flex-start; }
  .v2-article img.thumb { width:88px; height:66px; object-fit:cover; border-radius:8px; flex-shrink:0; background:#0007; }
  .v2-article-body { min-width:0; flex:1; }
  .v2-article-title { font-weight:900; font-size:0.98em; margin:2px 0 4px; }
  .v2-article-excerpt { font-size:0.84em; opacity:0.82; margin-bottom:6px; }
  .v2-article-meta { display:flex; align-items:center; gap:10px; font-size:0.7em; color:var(--v2-silver); }
  .v2-article audio { width:100%; margin-top:6px; height:32px; }
  .v2-admin-box { background: var(--v2-surface); border: 1px dashed var(--v2-gold); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
  .v2-admin-box textarea { width:100%; box-sizing:border-box; min-height:80px; background:var(--v2-bg); color:#fff; border:1px solid #2a3a4d; border-radius:8px; padding:8px; font-family:inherit; }
  .v2-admin-box input[type=text] { width:100%; box-sizing:border-box; background:var(--v2-bg); color:#fff; border:1px solid #2a3a4d; border-radius:8px; padding:8px; margin-bottom:8px; }
  .v2-admin-actions { display:flex; gap:6px; margin-top:6px; }
  .v2-admin-actions button { font-size:0.75em; padding:4px 8px; border-radius:6px; border:1px solid var(--v2-border); background:transparent; color:var(--v2-silver); cursor:pointer; }
</style>
</head>
<body class="v2">
<div class="v2-wrap" id="app">
  <div class="v2-card"><div class="v2-empty">Lade Blog…</div></div>
</div>

<script>
  MB.UI.mountHeader({ active: 'blog' });
  const isAdmin = window.location.search.includes('Altima');

  const CATEGORY_META = {
    kickoff:      { label: 'Turnierstart',    color: '#0EA5E9', image: 'assets/images/Blog_Kickoff.png' },
    progress:     { label: 'Zwischenstand',   color: '#8B5CF6', image: 'assets/images/Blog_PowerRankings.png' },
    record:       { label: 'Rekord',          color: '#F59E0B', image: 'assets/images/Blog_Rekord.png' },
    finals:       { label: 'Finale',          color: '#EF4444', image: 'assets/images/Blog_Finale.png' },
    champion:     { label: 'Champion',        color: '#22C55E', image: 'assets/images/Blog_Sieger.png' },
    song:         { label: 'Song',            color: '#3B82F6', image: 'assets/images/Blog_Song.png' },
    retrospective:{ label: 'Rückblick',       color: '#14B8A6', image: 'assets/images/Blog_WhoIs.png' },
    spurious:     { label: 'Analyse',         color: '#A855F7', image: 'assets/images/Blog_SpuriousCorrelations.png' },
    manual:       { label: 'Community',       color: '#94A3B8', image: 'assets/images/Blog_WhoIs.png' },
  };
  function catMeta(kind) { return CATEGORY_META[kind] || { label: 'Beitrag', color: '#64748B', image: 'assets/images/Blog_WhoIs.png' }; }

  let state = null, articles = [], activeTab = 'aktuell';

  function excerpt(text, n) {
    const clean = (text || '').replace(/\s+/g, ' ').trim();
    return clean.length > n ? clean.slice(0, n).trim() + '…' : clean;
  }
  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ', ' +
           d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  function renderArticle(a) {
    const meta = catMeta(a.kind);
    const audio = (a.media_type === 'audio' && a.media_url) ? `<audio controls src="${a.media_url}"></audio>` : '';
    const adminBtns = isAdmin ? `
      <div class="v2-admin-actions">
        <button onclick="editArticle('${a.id}')">✏️ Bearbeiten</button>
        <button onclick="removeArticle('${a.id}')">🗑️ Löschen</button>
      </div>` : '';
    return `
      <div class="v2-article">
        <img class="thumb" src="${meta.image}" alt="">
        <div class="v2-article-body">
          <span class="v2-badge" style="background:${meta.color};">${meta.label}</span>
          <div class="v2-article-title">${a.title || ''}</div>
          <div class="v2-article-excerpt">${excerpt(a.body, 140)}</div>
          <div class="v2-article-meta">📅 ${formatDate(a.created_at)}</div>
          ${audio}
          ${adminBtns}
        </div>
      </div>`;
  }

  function renderAdminBox() {
    if (!isAdmin) return '';
    return `
      <div class="v2-admin-box">
        <div style="font-weight:800; margin-bottom:8px; color:var(--v2-gold);">✏️ Neuen Beitrag verfassen (Admin)</div>
        <input type="text" id="mbNewTitle" placeholder="Titel">
        <textarea id="mbNewBody" placeholder="Text…"></textarea>
        <div class="v2-admin-actions" style="margin-top:8px;">
          <button class="v2-btn-primary" style="flex:none;" onclick="publishManual()">Veröffentlichen</button>
        </div>
        <div style="font-size:0.7em; color:var(--v2-silver); margin-top:8px;">
          Weitere Admin-Werkzeuge (Rekord-Momente, Musik, Auslosung) findest du weiterhin unter
          <a href="live.html?Altima" style="color:var(--v2-gold);">live.html?Altima</a>.
        </div>
      </div>`;
  }

  async function publishManual() {
    const title = document.getElementById('mbNewTitle').value.trim();
    const body = document.getElementById('mbNewBody').value.trim();
    if (!title || !body) { alert('Titel und Text ausfüllen.'); return; }
    const tid = MB.getCurrentTournamentId();
    const ok = await MB.Blog.pushManualArticle(tid, { title, body });
    if (!ok) { alert('Veröffentlichen fehlgeschlagen: ' + (MB.Blog.getLastPushArticleError() || 'unbekannter Fehler')); return; }
    document.getElementById('mbNewTitle').value = '';
    document.getElementById('mbNewBody').value = '';
    await reload();
  }

  async function editArticle(id) {
    const a = articles.find(x => String(x.id) === String(id));
    if (!a) return;
    const title = prompt('Titel:', a.title);
    if (title == null) return;
    const body = prompt('Text:', a.body);
    if (body == null) return;
    await MB.Blog.updateArticle(id, { title, body });
    await reload();
  }

  async function removeArticle(id) {
    if (!confirm('Diesen Beitrag wirklich löschen?')) return;
    await MB.Blog.deleteArticle(id);
    await reload();
  }

  function setTab(tab) {
    activeTab = tab;
    renderList();
  }

  function renderList() {
    const filtered = articles.filter(a => activeTab === 'rueckblick' ? a.kind === 'retrospective' : a.kind !== 'retrospective');
    const list = document.getElementById('mbArticleList');
    list.innerHTML = filtered.length ? filtered.map(renderArticle).join('') : `<div class="v2-empty">Noch keine Beiträge in dieser Kategorie.</div>`;
  }

  function renderShell() {
    document.getElementById('app').innerHTML = `
      <div class="v2-blog-header">
        <img class="crown" src="assets/icons/crown.svg" alt="">
        <div>
          <h1>Blog</h1>
          <div class="sub">News. Stories. Highlights.</div>
        </div>
      </div>
      ${renderAdminBox()}
      <div class="v2-tabbar">
        <button class="v2-tab ${activeTab === 'aktuell' ? 'active' : ''}" onclick="setTab('aktuell')">👑 Aktuelles Turnier</button>
        <button class="v2-tab ${activeTab === 'rueckblick' ? 'active' : ''}" onclick="setTab('rueckblick')">📚 Saisonrückblicke</button>
      </div>
      <div id="mbArticleList"></div>
    `;
    renderList();
  }

  async function reload() {
    const tid = MB.getCurrentTournamentId();
    articles = tid ? await MB.Blog.fetchArticles(tid, 100) : [];
    renderShell();
  }

  async function boot() {
    try { state = await MB.fetchCloudState(); } catch (e) {
      document.getElementById('app').innerHTML = `<div class="v2-card">Konnte Turnierdaten nicht laden. (${e.message})</div>`;
      return;
    }
    MB.UI.setState(state);
    await reload();
  }

  boot();
</script>
</body>
</html>
