<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Altima Bowl — Saison-Verwaltung</title>
<link rel="icon" type="image/png" href="maddenbowl.ico" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared.js"></script>
<script src="ui.js"></script>
<script src="blog.js"></script>
<style>
  body { margin: 0; padding: 0; }
  #app { padding: 16px; max-width: 900px; margin: 0 auto; padding-bottom: 60px; }
  h1 { border-bottom: 3px solid var(--nfl-red); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  table.list { width: 100%; border-collapse: collapse; font-size: 0.9em; margin-top: 10px; }
  table.list th, table.list td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #22304333; }
  .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 0.75em; text-transform: uppercase; font-weight: bold; }
  .status-completed { background: #0e3d33; color: var(--accent); }
  .status-running { background: #3d2e0e; color: #ffcc00; }
  .status-setup { background: #2a2a2a; color: #aaa; }
  button { background: var(--nfl-red); color: white; border: none; border-radius: 6px; padding: 8px 14px; font-weight: bold; cursor: pointer; }
  button.secondary { background: #263449; }
  button.small { padding: 5px 10px; font-size: 0.8em; margin-right: 6px; }
  input, select { background: #0e1622; color: #eee; border: 1px solid #2a3a4d; border-radius: 6px; padding: 6px 8px; }
  .editor { background: #0e1622; border-radius: 10px; padding: 14px; margin-top: 10px; }
  .editor h3 { margin-top: 0; color: var(--accent); }
  .row-line { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .row-line span.label { width: 90px; opacity: 0.7; font-size: 0.85em; }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
  .team-cell { display: flex; align-items: center; gap: 6px; background: #161f2c; border-radius: 6px; padding: 6px 8px; }
  .team-cell label { font-size: 0.8em; width: 40px; }
  .team-cell input { width: 50px; }
  .hint { font-size: 0.8em; opacity: 0.65; margin: 6px 0; }
  .team-cell.fetched { outline: 1px solid #c99700; }
  .team-cell.fetched.changed input { background: rgba(201,151,0,.25); }
  .import-box { background: #111a28; border: 1px solid #2a3a5c; border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
  .import-box .imp-log { font-size: 0.82em; line-height: 1.5; margin-top: 6px; }
  .import-box .imp-ok { color: #4ade80; } .import-box .imp-warn { color: #fbbf24; } .import-box .imp-err { color: #f87171; }
  .import-box details { margin-top: 6px; } .import-box summary { cursor: pointer; }
  .team-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .team-cell .rs-btn { margin-left: auto; padding: 2px 6px; font-size: 0.85em; background: transparent; border: 1px solid #2a3a5c; border-radius: 5px; cursor: pointer; opacity: .35; }
  .team-cell .rs-btn.has { opacity: 1; border-color: #c99700; }
  .team-cell .rs-btn:hover { background: #2a3a5c; }
  .rs-modal { position: fixed; inset: 0; z-index: 9500; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .rs-panel { background: #0f1a2d; border: 2px solid #c99700; border-radius: 10px; width: min(980px, 100%); max-height: 92vh; display: flex; flex-direction: column; padding: 14px 16px; }
  .rs-panel header { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #d50a0a; padding-bottom: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .rs-panel header img { width: 46px; height: 46px; object-fit: contain; }
  .rs-panel header h3 { margin: 0; font-size: 1.25em; } .rs-panel header .sub { font-size: .8em; opacity: .7; }
  .rs-panel header .vals { margin-left: auto; font-size: .9em; } .rs-panel header .vals b { color: #ffd23f; }
  .rs-panel .filt { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .rs-panel .filt button { padding: 3px 10px; font-size: .8em; }
  .rs-panel .filt button.on { background: #c99700; color: #000; }
  .rs-list { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 14px; }
  .rs-r { display: flex; align-items: center; gap: 6px; height: 28px; border-bottom: 1px solid rgba(255,255,255,.07); font-size: .88em; }
  .rs-r .o { width: 30px; text-align: center; font-weight: 800; background: #33415f; border-radius: 4px; padding: 2px 0; }
  .rs-r .o.m { background: #2f8f5b; } .rs-r .o.h { background: #c99700; color: #000; }
  .rs-r .p { width: 40px; opacity: .65; font-size: .85em; font-weight: 700; }
  .rs-r .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs-r.ir .n { text-decoration: line-through; text-decoration-color: #f87171; opacity: .75; }
  .rs-r .b { font-size: .7em; font-weight: 800; padding: 2px 5px; border-radius: 4px; }
  .rs-r .b.xf { background: #ffd23f; color: #000; } .rs-r .b.ss { background: #1e50c8; color: #fff; } .rs-r .b.irt { background: #d50a0a; color: #fff; }
  .rs-note { font-size: .82em; margin-top: 8px; color: #fbbf24; }
  .paste-box textarea { width: 100%; height: 90px; box-sizing: border-box; font-size: .75em; }
  .not-admin { padding: 40px; text-align: center; opacity: 0.7; }
</style>
</head>
<body>
<script>
  MB.UI.mountHeader({ active: 'seasons', adminMenu: MB.UI.isAdminUnlocked(), showAdminLogin: true, onAdminChange: () => location.reload() });
</script>

<div id="app"><div class="not-admin">Lade…</div></div>

<script>
  // Admin-Zugang läuft jetzt über den Login im Header statt über den alten
  // "?Altima"-Query-Parameter (siehe MB.UI.doAdminLogin in ui.js).
  const isAdmin = MB.UI.isAdminUnlocked();
  let tournaments = [];
  let editingId = null;

  async function boot() {
    const app = document.getElementById('app');
    if (!isAdmin) {
      app.innerHTML = `<div class="not-admin">🔒 Nur für Admins — oben rechts anmelden.</div>`;
      return;
    }
    // Löst als Nebeneffekt MB.getCurrentTournamentId() aus (wird für den
    // Blog-Rückblick-Button gebraucht, siehe renderRetroCard).
    try { await MB.fetchCloudState(); } catch (e) { /* egal, Retro-Button zeigt dann "kein aktives Turnier" */ }

    app.innerHTML = `
      <h1>🗂️ Saison-Verwaltung</h1>
      <div class="card" id="ratingsCard"></div>
      <div class="card">
        <h2>⚙️ Turnier-Regeln &amp; Standard-Einstellungen</h2>
        <div class="hint">Vorbelegung für das "Tournament Setup" in admin.html — einmal hier pflegen statt bei jedem neuen Turnier von Hand nachzutragen. Bereits laufende/abgeschlossene Turniere sind davon nicht betroffen.</div>
        <div id="rulesCard">Lade…</div>
      </div>
      <div class="card">
        <h2>📅 Nächstes Turnier: Madden-Version &amp; Termin</h2>
        <div class="hint">Madden-Version: welche Kader/OVR das Dashboard vor dem Turnier zeigt und womit das Setup startet. Termin: Countdown oben im Dashboard (leer = kein Countdown).</div>
        <div id="nextDateCard">Lade…</div>
      </div>
      <div class="card">
        <h2>🎲 Nächstes Turnier vorbereiten</h2>
        <div class="hint">Spielerliste vorab festlegen — die Ziehreihenfolge für die Live-Auslosung in admin.html wird automatisch berechnet (Toilet-Bowl-Sieger, Rookies, Sophomores ohne Vorjahr, Vorjahresteilnehmer vom Letzten bis zum Titelverteidiger, übrige Rückkehrer) und lässt sich per Drag &amp; Drop anpassen.</div>
        <div id="draftOrderCard">Lade…</div>
      </div>
      <div class="card">
        <h2>🏷️ Spitznamen</h2>
        <div class="hint">Wer hier einen Spitznamen hat, den spricht der Ring-Ansager (Enzo) beim Aufruf im Draft <b>vor dem Namen</b> („The Machine Tim“) und die Draft-Bühne zeigt ihn über dem Namen. Leer lassen = nur der Name. Wird im aktuellen Turnier gespeichert; vorbelegt aus dem letzten abgeschlossenen Turnier.</div>
        <div id="nicknamesCard">Lade…</div>
      </div>
      <div class="card">
        <h2>🚫 Teams für den Draft streichen</h2>
        <div class="hint">Angetippte Teams stehen im Draft nicht zur Wahl — sie erscheinen in der Draft-Show durchgestrichen. Wird mit dem Turnier-Setup in admin.html übernommen.</div>
        <div id="teamExclCard">Lade…</div>
      </div>
      <div class="card">
        <h2>✍️ Artikel verfassen</h2>
        <div class="hint">Freier Editor für redaktionelle Blog-Beiträge (Saisonrückblicke, Ankündigungen, alles) — Saison und Beitragsart frei wählbar, landet direkt im Turnierblog (blog.html). Zwei Entwürfe sind schon vorausgefüllt.</div>
        <div id="composerCard"></div>
      </div>
      <div class="card">
        <h2>Saisons</h2>
        <div class="hint">Abgeschlossene Saisons erscheinen in der Hall of Fame und fließen in die Quoten-/Flavour-Facts-Historie ein.</div>
        <table class="list" id="seasonsTable"></table>
      </div>
    `;
    await renderRatingsCard();
    await renderRulesCard();
    await renderDraftOrderCard();
    drawNextDateCard();
    drawTeamExclCard();
    await renderNicknamesCard();
    await loadSeasons();
    renderComposerCard();
  }

  // =========================================================
  // ZIEHREIHENFOLGE FÜRS NÄCHSTE TURNIER
  // -------------------------------------------------------------------
  // Spielerliste + Reihenfolge landen in config.draftOrder des aktuellen
  // "setup"/"running"-Turniers (siehe MB.pushCloudState) und werden von
  // admin.html beim Öffnen der Live-Auslosung automatisch übernommen.
  // =========================================================
  let draftOrderList = []; // [{name, reason}]
  let draftOrderCloudState = null;
  let _dragFromIndex = null;

  async function renderDraftOrderCard() {
    const el = document.getElementById('draftOrderCard');
    try {
      draftOrderCloudState = await MB.fetchCloudState();
    } catch (e) {
      el.innerHTML = `<div class="hint">Konnte Turnierstatus nicht laden: ${e.message}</div>`;
      return;
    }
    draftOrderList = Array.isArray(draftOrderCloudState.config?.draftOrder)
      ? draftOrderCloudState.config.draftOrder.map((e) => ({ ...e })) : [];
    // Frühere Teilnehmer als Vorschläge (Historie aus Supabase)
    try {
      const hist = await MB.loadAndBuildHistory();
      draftOrderKnownNames = Array.from(hist.players || []).map(String).sort((a, b) => a.localeCompare(b, 'de'));
    } catch (e) { draftOrderKnownNames = []; }
    drawDraftOrderCard();
  }
  let draftOrderKnownNames = [];
  // Vorschläge = frühere Teilnehmer, die noch nicht in der Liste stehen
  function draftOrderSuggestions() {
    const taken = new Set(draftOrderList.map((e) => e.name.trim().toLowerCase()));
    return draftOrderKnownNames.filter((n) => !taken.has(n.trim().toLowerCase()));
  }
  function addDraftOrderName(name) {
    document.getElementById('draftOrderNewName').value = name;
    addDraftOrderEntry();
  }

  function drawDraftOrderCard() {
    const el = document.getElementById('draftOrderCard');
    const running = draftOrderCloudState && draftOrderCloudState.players && draftOrderCloudState.players.length > 0;

    const rowsHtml = draftOrderList.length
      ? draftOrderList.map((entry, i) => `
          <div class="row-line draft-order-row" draggable="true" data-index="${i}"
               ondragstart="draftOrderDragStart(event)" ondragover="draftOrderDragOver(event)"
               ondrop="draftOrderDrop(event)" ondragend="draftOrderDragEnd(event)"
               style="cursor:grab; background:#161f2c; border-radius:6px; padding:8px 10px; margin-bottom:0;">
            <span style="width:22px; opacity:0.6; font-weight:bold;">${i + 1}.</span>
            <span style="flex:1;"><b>${entry.name}</b> <span style="opacity:0.6; font-size:0.85em;">— ${entry.reason || 'manuell'}</span></span>
            <button class="small secondary" onclick="removeDraftOrderEntry(${i})">✕</button>
          </div>`).join('')
      : `<div class="hint">Noch keine Spieler eingetragen.</div>`;

    el.innerHTML = `
      ${running ? `<div class="hint">⚠️ Es existiert bereits ein Turnier (Setup oder laufend) — Änderungen hier wirken auf genau dieses Turnier.</div>` : ''}
      <div class="row-line">
        <input type="text" id="draftOrderNewName" list="draftOrderNameList" placeholder="Spielername" style="flex:1; min-width:150px;" onkeydown="if(event.key==='Enter'){event.preventDefault();addDraftOrderEntry();}">
        <button onclick="addDraftOrderEntry()">+ Hinzufügen</button>
      </div>
      <datalist id="draftOrderNameList">${draftOrderSuggestions().map((n) => `<option value="${n.replace(/"/g, '&quot;')}"></option>`).join('')}</datalist>
      ${draftOrderSuggestions().length ? `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center;">
        <span class="hint" style="margin:0;">Frühere Teilnehmer:</span>
        ${draftOrderSuggestions().map((n) => `<button class="small secondary" onclick="addDraftOrderName(this.dataset.n)" data-n="${n.replace(/"/g, '&quot;')}">+ ${n}</button>`).join('')}
      </div>` : ''}
      <div id="draftOrderRows" style="display:flex; flex-direction:column; gap:6px; margin:10px 0;">${rowsHtml}</div>
      <div class="row-line">
        <button class="secondary" onclick="recomputeDraftOrder()">🔀 Reihenfolge automatisch berechnen</button>
        <button onclick="saveDraftOrder()">💾 Speichern</button>
      </div>
    `;
  }

  function addDraftOrderEntry() {
    const input = document.getElementById('draftOrderNewName');
    const name = (input.value || '').trim();
    if (!name) return;
    if (draftOrderList.some((e) => e.name.toLowerCase() === name.toLowerCase())) { input.value = ''; return; }
    draftOrderList.push({ name, reason: 'manuell hinzugefügt' });
    input.value = '';
    drawDraftOrderCard();
    document.getElementById('draftOrderNewName').focus();
  }

  function removeDraftOrderEntry(i) {
    draftOrderList.splice(i, 1);
    drawDraftOrderCard();
  }

  async function recomputeDraftOrder() {
    const names = draftOrderList.map((e) => e.name);
    if (!names.length) return;
    let history;
    try { history = await MB.loadAndBuildHistory(); }
    catch (e) { alert('Historie konnte nicht geladen werden: ' + e.message); return; }
    draftOrderList = MB.computeDraftOrder(history, names);
    drawDraftOrderCard();
  }

  // ---- Spitznamen (config.nicknames: Name -> Spitzname) ----
  let nickNames = [], nickMap = {};
  async function renderNicknamesCard() {
    const el = document.getElementById('nicknamesCard');
    if (!el) return;
    if (!draftOrderCloudState) { el.innerHTML = '<div class="hint">Turnierstatus nicht verfügbar.</div>'; return; }
    const cfg = draftOrderCloudState.config || {};
    let last = null;
    try { last = await MB.fetchLastCompletedTournament(); } catch (e) { /* ohne Vorbelegung weiter */ }
    const names = [];
    const add = (n) => { n = String(n || '').trim(); if (n && !names.some(x => x.toLowerCase() === n.toLowerCase())) names.push(n); };
    (draftOrderList || []).forEach(e => add(e.name));
    (draftOrderCloudState.players || []).forEach(p => add(p.name));
    if (last && last.state) last.state.players.forEach(p => add(p.name));
    Object.keys(cfg.nicknames || {}).forEach(add);
    nickNames = names;
    nickMap = { ...((last && last.state && last.state.config && last.state.config.nicknames) || {}), ...(cfg.nicknames || {}) };
    drawNicknamesCard();
  }
  function drawNicknamesCard() {
    const el = document.getElementById('nicknamesCard');
    if (!nickNames.length) { el.innerHTML = '<div class="hint">Noch keine Spielernamen bekannt (erst Draft-Reihenfolge bzw. Spieler anlegen).</div>'; return; }
    const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const val = (n) => { const k = Object.keys(nickMap).find(x => x.toLowerCase() === n.toLowerCase()); return k ? nickMap[k] : ''; };
    el.innerHTML = nickNames.map((n, i) => `<div class="row-line" style="display:flex; align-items:center; gap:10px; margin:6px 0;">
        <span style="width:140px;"><b>${esc(n)}</b></span>
        <input type="text" id="nick-${i}" maxlength="28" placeholder="Spitzname (optional)" value="${esc(val(n))}" style="flex:1; max-width:320px;">
      </div>`).join('') + `<button style="margin-top:8px;" onclick="saveNicknames()">💾 Speichern</button>`;
  }
  async function saveNicknames() {
    if (!draftOrderCloudState) return;
    const out = {};
    nickNames.forEach((n, i) => {
      const v = (document.getElementById('nick-' + i).value || '').replace(/["„“”<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 28);
      if (v) out[n] = v;
    });
    const mergedConfig = { ...(draftOrderCloudState.config || {}), nicknames: out };
    try {
      await MB.pushCloudState({ ...draftOrderCloudState, config: mergedConfig });
      draftOrderCloudState.config = mergedConfig; nickMap = out;
      alert(Object.keys(out).length ? 'Spitznamen gespeichert.' : 'Alle Spitznamen entfernt.');
    } catch (e) { alert('Speichern fehlgeschlagen: ' + e.message); }
  }

  // ---- Termin nächstes Turnier (config.nextTournamentAt, ISO-Zeitpunkt) ----
  function drawNextDateCard() {
    const el = document.getElementById('nextDateCard'); if (!el) return;
    if (!draftOrderCloudState) { el.innerHTML = '<div class="hint">Turnierstatus nicht verfügbar.</div>'; return; }
    const iso = draftOrderCloudState.config && draftOrderCloudState.config.nextTournamentAt;
    const d = iso ? new Date(iso) : null;
    const local = d && !isNaN(d) ? new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
    const my = (draftOrderCloudState.config && draftOrderCloudState.config.maddenYear) || String((d && !isNaN(d) ? d : new Date()).getFullYear());
    const years = []; for (let y = new Date().getFullYear() - 1; y <= new Date().getFullYear() + 2; y++) years.push(String(y));
    el.innerHTML = `<div class="row-line" style="align-items:center;">
        <label style="margin:0;">Gespielt mit</label>
        <select id="nextMaddenYear" style="width:auto;">${years.map(y => `<option value="${y}" ${y === String(my) ? 'selected' : ''}>Madden ${y.slice(2)}</option>`).join('')}</select>
        <input type="datetime-local" id="nextTournamentAt" value="${local}" style="max-width:240px;">
        <button onclick="saveNextDate()">💾 Speichern</button>
        <button class="secondary" onclick="document.getElementById('nextTournamentAt').value=''; saveNextDate();">Entfernen</button>
      </div>
      ${d && !isNaN(d) ? `<div class="hint">Aktuell: ${d.toLocaleString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })} Uhr</div>` : ''}`;
  }
  async function saveNextDate() {
    if (!draftOrderCloudState) return;
    const v = document.getElementById('nextTournamentAt').value;
    const iso = v ? new Date(v).toISOString() : null;
    const mergedConfig = { ...(draftOrderCloudState.config || {}), nextTournamentAt: iso, maddenYear: document.getElementById('nextMaddenYear').value };
    try {
      await MB.pushCloudState({ ...draftOrderCloudState, config: mergedConfig });
      draftOrderCloudState.config = mergedConfig;
      drawNextDateCard();
    } catch (e) { alert('Speichern fehlgeschlagen: ' + e.message); }
  }

  // ---- Teams streichen (config.excludedTeams) ----
  function drawTeamExclCard() {
    const el = document.getElementById('teamExclCard');
    if (!el) return;
    if (!draftOrderCloudState) { el.innerHTML = '<div class="hint">Turnierstatus nicht verfügbar.</div>'; return; }
    if (!window._exclSet) window._exclSet = new Set(Array.isArray(draftOrderCloudState.config?.excludedTeams) ? draftOrderCloudState.config.excludedTeams : []);
    const ratings = (MB.maddenRatings && (MB.maddenRatings['2026'])) || {};
    const teams = MB.nflTeams.map(t => ({ ...t, rating: ratings[t.id] || 0 })).sort((a, b) => b.rating - a.rating);
    el.innerHTML = `<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px; margin:10px 0;">${teams.map(t => {
      const ex = window._exclSet.has(t.id);
      return `<button class="secondary" onclick="toggleExclTeam('${t.id}')" style="display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border:2px solid ${ex ? '#ff3b3b' : 'transparent'}; opacity:${ex ? 0.45 : 1};">
        <img src="https://static.www.nfl.com/t_q-best/league/api/clubs/logos/${t.id}.png" style="width:28px;height:28px;object-fit:contain;${ex ? 'filter:grayscale(1);' : ''}">
        <span style="font-size:0.7em; ${ex ? 'text-decoration:line-through;' : ''}">${t.n}</span><span style="font-size:0.65em; opacity:.7;">${t.rating || ''}</span></button>`;
    }).join('')}</div>
    <div class="hint">${window._exclSet.size} gestrichen · ${MB.nflTeams.length - window._exclSet.size} wählbar</div>
    <button onclick="saveExclTeams()">💾 Speichern</button>`;
  }
  function toggleExclTeam(id) {
    if (window._exclSet.has(id)) window._exclSet.delete(id); else window._exclSet.add(id);
    drawTeamExclCard();
  }
  async function saveExclTeams() {
    if (!draftOrderCloudState) return;
    const mergedConfig = { ...(draftOrderCloudState.config || {}), excludedTeams: [...window._exclSet] };
    try {
      await MB.pushCloudState({ ...draftOrderCloudState, config: mergedConfig });
      draftOrderCloudState.config = mergedConfig;
      alert('Gestrichene Teams gespeichert.');
    } catch (e) { alert('Speichern fehlgeschlagen: ' + e.message); }
  }

  async function saveDraftOrder() {
    if (!draftOrderCloudState) return;
    const mergedConfig = { ...(draftOrderCloudState.config || {}), draftOrder: draftOrderList };
    try {
      await MB.pushCloudState({ ...draftOrderCloudState, config: mergedConfig });
      draftOrderCloudState.config = mergedConfig;
      alert('Ziehreihenfolge gespeichert — wird beim nächsten Öffnen der Auslosung in admin.html automatisch geladen.');
    } catch (e) {
      alert('Speichern fehlgeschlagen: ' + e.message);
    }
  }

  // ---- Drag & Drop (nativ, keine Library nötig) ----
  function draftOrderDragStart(ev) {
    _dragFromIndex = Number(ev.currentTarget.dataset.index);
    ev.currentTarget.style.opacity = '0.4';
    ev.dataTransfer.effectAllowed = 'move';
  }
  function draftOrderDragOver(ev) {
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
  }
  function draftOrderDrop(ev) {
    ev.preventDefault();
    const toIndex = Number(ev.currentTarget.dataset.index);

  async function loadSeasons() {

      <tr><th>Jahr</th><th>Status</th><th></th></tr>
      ${tournaments.map(row => `
        <tr>
          <td>${row.year ?? '—'}</td>
          <td><span class="status-pill status-${row.status}">${row.status}</span></td>

  function renderEditorPlaceholder(id) { return `<div class="editor" id="editor-${id}">Lade Details…</div>`; }

  async function saveEditor(id) {
    const sb = MB.getSupabaseClient();
    const year = parseInt(document.getElementById(`edit-year-${id}`).value) || null;
    const status = document.getElementById(`edit-status-${id}`).value;

    // Standings einsammeln
    const wrap = document.getElementById(`standings-rows-${id}`);
    const standings = [...wrap.children].map(row => {
      const idxEl = row.id.split('-').pop();
      const rank = parseInt(document.getElementById(`edit-st-${id}-${idxEl}-rank`)?.value);
      const name = document.getElementById(`edit-st-${id}-${idxEl}-name`)?.value?.trim();
      const points = parseInt(document.getElementById(`edit-st-${id}-${idxEl}-points`)?.value);
      return name ? { rank, name, points } : null;
    }).filter(Boolean);

    try {
      const { error: tErr } = await sb.from('tournaments').update({ year, status, final_standings: standings }).eq('id', id);
      if (tErr) throw tErr;

      const [playersRes, gmRes, pmRes] = await Promise.all([
        sb.from('players').select('id,idx').eq('tournament_id', id),
        sb.from('group_matches').select('id').eq('tournament_id', id),
        sb.from('playoff_matches').select('id').eq('tournament_id', id),
      ]);

      for (const p of (playersRes.data || [])) {
        const name = document.getElementById(`edit-pname-${id}-${p.idx}`)?.value?.trim();
        const team = document.getElementById(`edit-pteam-${id}-${p.idx}`)?.value?.trim();
        if (name === undefined) continue;
        const { error } = await sb.from('players').update({ name, team }).eq('id', p.id);
        if (error) throw error;
      }

      for (const m of (gmRes.data || [])) {
        const s1El = document.getElementById(`edit-gm-${m.id}-s1`), s2El = document.getElementById(`edit-gm-${m.id}-s2`);
        if (!s1El) continue;
        const s1 = s1El.value === '' ? null : parseInt(s1El.value);
        const s2 = s2El.value === '' ? null : parseInt(s2El.value);
        const { error } = await sb.from('group_matches').update({ s1, s2 }).eq('id', m.id);
        if (error) throw error;
      }

      for (const m of (pmRes.data || [])) {
        const s1El = document.getElementById(`edit-pm-${m.id}-s1`), s2El = document.getElementById(`edit-pm-${m.id}-s2`);
        if (!s1El) continue;
        const s1 = s1El.value === '' ? null : parseInt(s1El.value);
        const s2 = s2El.value === '' ? null : parseInt(s2El.value);
        const { error } = await sb.from('playoff_matches').update({ s1, s2 }).eq('id', m.id);
        if (error) throw error;
      }

      alert('Gespeichert.');
      editingId = null;
      await loadSeasons();
    } catch (e) {
      alert('Speichern fehlgeschlagen: ' + e.message);
    }
  }

    };

      hubUrl: document.getElementById('ruleHubUrl').value.trim(),

    try {

      alert('Speichern fehlgeschlagen: ' + e.message);

  }

          <span class="hint" id="maddenRosterInfo" style="margin:0;"></span>
        </div>
        <div class="hint">Holt Team-OVR und Kader aller 32 Teams (maddenratings.com) plus die aktuelle NFL-IR-Liste — dauert ca. 1–2 Minuten. Die OVR-Werte landen unten im Raster und lassen sich vor dem Speichern noch ändern; die Kader (für die Ansicht im Draft) werden sofort gespeichert.</div>
        <details class="paste-box" style="margin-top:8px;">
          <summary>Wenn der Abruf blockiert wird (HTTP 403): über den eigenen Browser sammeln</summary>
          <div class="hint">maddenratings.com sperrt teils Server-Anfragen, im normalen Browser funktioniert die Seite aber. Dieses Skript läuft in deinem Browser auf der Seite selbst, holt alle 32 Teams nacheinander (ca. 2 Minuten) und legt das Ergebnis in die Zwischenablage:</div>
          <ol class="hint" style="margin:4px 0 6px 18px; padding:0;">
            <li><button class="small secondary" onclick="copyCollectorScript()">Skript kopieren</button></li>
            <li><a href="https://www.maddenratings.com/teams/arizona-cardinals" target="_blank" rel="noopener" style="color:#ffd23f;">maddenratings.com</a> in einem neuen Tab öffnen → <b>F12</b> → Reiter „Konsole“ → Skript einfügen → Enter. (Chrome/Firefox verlangen vorher einmalig, <code>allow pasting</code> einzutippen.)</li>
            <li>Warten, bis „FERTIG“ in der Konsole steht (das Ergebnis landet automatisch in der Zwischenablage; falls nicht: <code>copy(window.__maddenResult)</code> eintippen + Enter), dann hier einfügen:</li>
          </ol>
          <textarea id="collectorResult" placeholder="Ergebnis aus der Zwischenablage hier einfügen …"></textarea>
          <div class="row-line"><button class="small" onclick="importCollectorResult()">Ergebnis übernehmen</button></div>
        </details>
        <div class="imp-log" id="maddenImportLog"></div>
      </div>
      <div class="team-grid" id="teamGrid"></div>
      <button onclick="saveRatingsGrid()">Speichern</button>
    `;
    await loadRatingsGrid();
  }

  async function getKnownYears() {
    const sb = MB.getSupabaseClient();
    const { data } = await sb.from('tournaments').select('year').order('year', { ascending: false });
    const years = [...new Set((data || []).map(r => r.year).filter(Boolean))];
    return years;
  }

  async function loadRatingsGrid() {
    const year = document.getElementById('ratingsYear').value;
    const ratings = await MB.loadTeamRatings(year);
    const grid = document.getElementById('teamGrid');
    grid.innerHTML = MB.nflTeams.map(t => `
      <div class="team-cell">
        <label>${t.id}</label>
        <input type="number" min="40" max="99" id="rating-${t.id}" value="${ratings[t.id] ?? 85}">
        <button type="button" class="rs-btn" id="rsbtn-${t.id}" title="Kader &amp; IR anzeigen" onclick="showTeamRoster('${t.id}')">📋</button>
      </div>
    `).join('');
    refreshRosterInfo();
  }

  async function refreshRosterInfo() {
    const el = document.getElementById('maddenRosterInfo');
    if (!el) return;
    const year = document.getElementById('ratingsYear').value;
    const map = await MB.Rosters.loadRostersForYear(year);
    const n = Object.keys(map).length;
    MB.nflTeams.forEach(t => { const b = document.getElementById(`rsbtn-${t.id}`); if (b) b.classList.toggle('has', !!map[t.id]); });
    el.textContent = n ? `Gespeicherte Kader für ${year}: ${n}/32` : `Für ${year} sind noch keine Kader gespeichert.`;
  }

  // =========================================================
  // MADDEN-IMPORT (Team-OVR + Kader + IR)
  // =========================================================
  let _lastImport = null; // { results:{TEAM:r}, failed:[{id,msg}], irInfo, irError, aborted }
  const _sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const _jitter = (min, max) => min + Math.random() * (max - min);

  // Ein Team abrufen. Bei Fehlern (z. B. HTTP 403 der Fremdseite) mit wachsenden Pausen wiederholen.
  async function fetchTeamPatiently(id, label, log) {
    const MAX = 3;
    let lastErr;
    for (let attempt = 1; attempt <= MAX; attempt++) {
      try {
        const r = await MB.Rosters.fetchMaddenTeam(id);
        if (!r.players || !r.players.length) throw new Error('keine Spieler erkannt');
        return r;
      } catch (e) {
        lastErr = e;
        if (attempt === MAX) break;
        const wait = 20 * attempt; // 20 s, 40 s
        for (let sec = wait; sec > 0; sec--) {
          log.innerHTML = `${label}: Abruf gescheitert (${MB.escHtml((e.message || '').slice(0, 80))}). Neuer Versuch ${attempt + 1}/${MAX} in ${sec} s …`;
          await _sleep(1000);
        }
        log.innerHTML = `${label}: Versuch ${attempt + 1}/${MAX} …`;
      }
    }
    throw lastErr;
  }

  async function runMaddenImport(onlyTeams) {
    const btn = document.getElementById('btnMaddenImport');
    const log = document.getElementById('maddenImportLog');
    const ids = onlyTeams || MB.nflTeams.map(t => t.id);
    const keep = (onlyTeams && _lastImport) ? _lastImport : null;
    const results = keep ? keep.results : {};
    const failed = [];
    let aborted = false, consecutiveFails = 0, versionChecked = !!keep;
    btn.disabled = true;
    if (!onlyTeams) document.querySelectorAll('.team-cell').forEach(c => c.classList.remove('fetched', 'changed'));
    try {
      for (let i = 0; i < ids.length; i++) {
        const label = `Team ${i + 1}/${ids.length} (${ids[i]})`;
        log.innerHTML = `${label} …`;
        try {
          const r = await fetchTeamPatiently(ids[i], label, log);
          results[ids[i]] = r;
          consecutiveFails = 0;
          if (!versionChecked && r.madden) {
            versionChecked = true;
            const yEl = document.getElementById('ratingsYear');
            if (Number(yEl.value) !== 2000 + r.madden &&
                confirm(`maddenratings.com zeigt aktuell Madden ${r.madden}. Als Jahr ${2000 + r.madden} speichern?\n(OK = ${2000 + r.madden}, Abbrechen = bei ${yEl.value} bleiben)`)) {
              yEl.value = 2000 + r.madden;
              await loadRatingsGrid();
            }
          }
        } catch (e) {
          failed.push({ id: ids[i], msg: e.message || String(e) });
          if (++consecutiveFails >= 3) { // Fremdseite blockt offenbar -> nicht weiter hämmern
            aborted = true;
            ids.slice(i + 1).forEach(id => failed.push({ id, msg: 'nicht versucht (Abbruch nach 3 Fehlern in Folge)' }));
            break;
          }
        }
        if (i < ids.length - 1) await _sleep(_jitter(2500, 4500)); // höflich zur Fremdseite
      }

      // NFL-IR-Liste (einmal pro Lauf; bei Wiederholung der alten Liste)
      let irInfo = keep ? keep.irInfo : null, irError = keep ? keep.irError : '';
      if (!irInfo) {
        log.innerHTML = 'Hole NFL-IR-Liste …';
        try { irInfo = await MB.Rosters.fetchIrList(); } catch (e) { irError = e.message || String(e); }
      }
      _lastImport = { results, failed, irInfo, irError, aborted };
      await finalizeImport();
    } catch (e) {
      log.innerHTML = `<div class="imp-err">Abruf abgebrochen: ${MB.escHtml(e.message || String(e))}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  // IR zuordnen, Kader speichern, OVR ins Raster übernehmen, Zusammenfassung zeigen (idempotent)
  async function finalizeImport() {
    const li = _lastImport, esc = MB.escHtml, log = document.getElementById('maddenImportLog');
    const results = li.results;
    let irRes = null;
    if (li.irInfo && Object.keys(results).length) {
      irRes = MB.Rosters.applyIrToRosters(results, li.irInfo.ir);
      Object.keys(results).forEach(t => { results[t].irUnmatched = irRes.unmatchedByTeam[t] || []; });
    }

    const year = document.getElementById('ratingsYear').value;
    let saveMsg = '';
    if (Object.keys(results).length) {
      try {
        await MB.Rosters.saveRosters(year, Object.entries(results).map(([team, r]) => ({
          team, madden: r.madden, teamOvr: r.teamOvr, players: r.players, irUnmatched: r.irUnmatched || [],
        })));
        saveMsg = `<div class="imp-ok">✔ ${Object.keys(results).length} Kader für ${esc(year)} gespeichert.</div>`;
      } catch (e) {
        saveMsg = `<div class="imp-err">✘ Kader speichern fehlgeschlagen: ${esc(e.message || String(e))}<br>Falls die Tabelle fehlt: <code>supabase-migration-madden-rosters.sql</code> im Supabase SQL-Editor ausführen.</div>`;
      }
    }

    let changed = 0;
    Object.entries(results).forEach(([team, r]) => {
      const inp = document.getElementById(`rating-${team}`);
      if (!inp || r.teamOvr == null) return;
      if (!inp.parentElement.classList.contains('fetched')) {
        const before = parseInt(inp.value);
        inp.value = r.teamOvr;
        inp.parentElement.classList.add('fetched');
        if (before !== r.teamOvr) inp.parentElement.classList.add('changed');
      }
      inp.title = `Madden-Seite: ${r.teamOvr}`;
    });
    changed = document.querySelectorAll('.team-cell.changed').length;

    // Nicht zuordenbare IR nur für Teams mit Kader zeigen (sonst ist "nicht zuordenbar" unvermeidlich)
    const unm = irRes ? Object.entries(irRes.unmatchedByTeam).filter(([t]) => results[t]) : [];
    const unmCount = unm.reduce((n, [, a]) => n + a.length, 0);
    const irNoRoster = irRes ? irRes.total - irRes.matched - unmCount : 0;
    const warns = Object.entries(results).filter(([, r]) => r.warnings && r.warnings.length).map(([t, r]) => `${t}: ${r.warnings.slice(0, 3).join('; ')}`);
    const players = Object.values(results).reduce((n, r) => n + r.players.length, 0);
    const failed = li.failed;

    log.innerHTML = `
      <div class="${failed.length ? 'imp-warn' : 'imp-ok'}">${Object.keys(results).length}/32 Teams · ${players} Spieler · ${changed} OVR-Werte weichen vom bisherigen Raster ab (markiert).</div>
      ${saveMsg}
      ${Object.keys(results).length ? `<div class="imp-warn">➜ OVR-Werte prüfen/ändern (📋 pro Team zeigt den Kader) und unten auf <b>Speichern</b> klicken, damit sie für Quoten und Draft gelten.</div>` : ''}
      ${li.irInfo ? `<div>IR-Liste: ${irRes ? irRes.total : li.irInfo.ir.length} Spieler · ${irRes ? irRes.matched : 0} zugeordnet · <b class="${unmCount ? 'imp-warn' : 'imp-ok'}">${unmCount} bei Teams mit Kader nicht zuordenbar</b>${irNoRoster > 0 ? ` · ${irNoRoster} gehören zu Teams ohne Kader (noch offen)` : ''}.${li.irInfo.ir.length === 0 ? ' <span class="imp-err">Keine IR-Spieler gefunden — Statusfelder der Quelle: ' + esc(JSON.stringify(li.irInfo.statusCounts)) + '</span>' : ''}</div>` : `<div class="imp-err">IR-Liste nicht abrufbar: ${esc(li.irError)}</div>`}
      ${unm.length ? `<details><summary>Nicht zuordenbare IR-Spieler (NFL-IR, aber nicht im Madden-Kader dieses Teams)</summary>${unm.map(([t, a]) => `<div><b>${esc(t)}</b>: ${a.map(x => esc(x.n) + (x.p ? ' (' + esc(x.p) + ')' : '')).join(', ')}</div>`).join('')}</details>` : ''}
      ${warns.length ? `<details><summary class="imp-warn">Hinweise zum Parsen (${warns.length})</summary>${warns.map(w => `<div>${esc(w)}</div>`).join('')}</details>` : ''}
      ${failed.length ? `
        <div class="imp-err" style="margin-top:6px;">${li.aborted ? 'Abbruch: 3 Teams in Folge sind nach Wiederholungen gescheitert — die Fremdseite blockt gerade. ' : ''}Fehlgeschlagen (${failed.length}): ${failed.map(f => esc(f.id)).join(', ')}</div>
        <details><summary>Fehlermeldungen</summary>${failed.map(f => `<div>${esc(f.id)}: ${esc(f.msg)}</div>`).join('')}</details>
        <div style="margin-top:6px;"><button class="small secondary" onclick="runMaddenImport(_lastImport.failed.map(f => f.id))">Nur fehlgeschlagene erneut abrufen (später/ in ein paar Minuten)</button></div>
        <details class="paste-box"><summary>Alternative: Seitenquelltext selbst einfügen</summary>
          <div class="hint">Im Browser die Teamseite auf maddenratings.com öffnen (z. B. …/teams/baltimore-ravens) → Rechtsklick → „Seitenquelltext anzeigen“ → alles markieren (Strg+A), kopieren und hier einfügen.</div>
          <div class="row-line"><select id="pasteTeam">${failed.map(f => `<option value="${esc(f.id)}">${esc(f.id)}</option>`).join('')}</select>
          <button class="small" onclick="importPastedHtml()">Quelltext auswerten</button></div>
          <textarea id="pasteHtml" placeholder="Quelltext hier einfügen …"></textarea>
        </details>` : ''}`;
    refreshRosterInfo();
  }

  async function importPastedHtml() {
    const team = document.getElementById('pasteTeam').value;
    const html = document.getElementById('pasteHtml').value;
    if (!html || html.length < 1000) { alert('Bitte den kompletten Seitenquelltext einfügen.'); return; }
    try {
      const r = MB.Rosters.parseTeamHtmlDom(html); // lokal im Browser, braucht keine Edge Function
      if (!r.players || !r.players.length) throw new Error('keine Spieler erkannt — stimmt die Seite (Team)?');
      _lastImport.results[team] = r;
      _lastImport.failed = _lastImport.failed.filter(f => f.id !== team);
      await finalizeImport();
    } catch (e) { alert('Auswerten fehlgeschlagen: ' + (e.message || e)); }
  }

  async function copyCollectorScript() {
    const script = MB.Rosters.buildCollectorScript();
    try { await navigator.clipboard.writeText(script); alert('Skript kopiert. Jetzt auf maddenratings.com in die Konsole (F12) einfügen.'); }
    catch (e) { prompt('Automatisches Kopieren nicht möglich — bitte manuell kopieren (Strg+C):', script); }
  }

  async function importCollectorResult() {
    const log = document.getElementById('maddenImportLog');
    const raw = document.getElementById('collectorResult').value.trim();
    if (!raw) { alert('Bitte zuerst das Ergebnis aus der Zwischenablage einfügen.'); return; }
    let data;
    try { data = JSON.parse(raw); } catch (e) { alert('Das ist kein gültiges Ergebnis (JSON). Bitte genau das kopieren, was das Skript in die Zwischenablage gelegt hat.'); return; }
    const teams = data && data.teams;
    if (!teams || typeof teams !== 'object') { alert('Ergebnis hat nicht das erwartete Format.'); return; }
    const ids = MB.nflTeams.map(t => t.id).filter(id => teams[id] && Array.isArray(teams[id].players) && teams[id].players.length);
    if (!ids.length) { alert('Im Ergebnis sind keine Teams mit Spielern enthalten.'); return; }

    const btnImp = document.getElementById('btnMaddenImport');
    btnImp.disabled = true;
    try {
      const first = teams[ids[0]];
      const yEl = document.getElementById('ratingsYear');
      if (first.madden && Number(yEl.value) !== 2000 + first.madden &&
          confirm(`Die Daten stammen aus Madden ${first.madden}. Als Jahr ${2000 + first.madden} speichern?\n(OK = ${2000 + first.madden}, Abbrechen = bei ${yEl.value} bleiben)`)) {
        yEl.value = 2000 + first.madden;
        await loadRatingsGrid();
      }
      const prev = _lastImport || { results: {}, failed: [], irInfo: null, irError: '', aborted: false };
      ids.forEach(id => { prev.results[id] = { team: id, madden: teams[id].madden, teamOvr: teams[id].teamOvr, players: teams[id].players, warnings: teams[id].warnings || [] }; });
      prev.failed = MB.nflTeams.map(t => t.id).filter(id => !prev.results[id]).map(id => ({ id, msg: 'im Browser-Ergebnis nicht enthalten' }));
      prev.aborted = false;
      if (!prev.irInfo) {
        log.innerHTML = 'Hole NFL-IR-Liste …';
        try { prev.irInfo = await MB.Rosters.fetchIrList(); prev.irError = ''; } catch (e) { prev.irError = e.message || String(e); }
      }
      _lastImport = prev;
      await finalizeImport();
    } catch (e) {
      log.innerHTML = `<div class="imp-err">Übernehmen fehlgeschlagen: ${MB.escHtml(e.message || String(e))}</div>`;
    } finally { btnImp.disabled = false; }
  }

  // =========================================================
  // KADER-ANSICHT je Team (zum Prüfen neben den OVR-Werten)
  // =========================================================
  async function showTeamRoster(teamId) {
    const year = document.getElementById('ratingsYear').value;
    const esc = MB.escHtml;
    const meta = MB.nflTeams.find(t => t.id === teamId) || { n: teamId };
    const row = await MB.Rosters.loadRoster(year, teamId);
    const inp = document.getElementById(`rating-${teamId}`);
    const modal = document.createElement('div');
    modal.className = 'rs-modal';
    const close = () => { modal.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    const players = (row && row.players) || [];
    const irCount = players.filter(p => p.ir).length;
    const um = (row && row.ir_unmatched) || [];
    modal.innerHTML = `<div class="rs-panel">
      <header><img src="https://static.www.nfl.com/t_q-best/league/api/clubs/logos/${esc(teamId)}.png" alt="">
        <div><h3>${esc(meta.n)}</h3><div class="sub">${players.length ? `${players.length} Spieler${row.madden_version ? ' · Madden ' + row.madden_version : ''} · Stand ${new Date(row.fetched_at).toLocaleDateString('de-DE')} · ${irCount} auf IR` : 'Kein Kader gespeichert'}</div></div>
        <div class="vals">Raster: <b>${esc(inp ? inp.value : '–')}</b>${row && row.team_ovr != null ? ` · Madden-Seite: <b>${row.team_ovr}</b>` : ''}</div>
        <button class="small secondary" id="rsClose">✕ Schließen</button></header>
      ${players.length ? `<div class="filt"><button class="small secondary on" data-f="all">Alle</button><button class="small secondary" data-f="ir">Nur IR</button><button class="small secondary" data-f="badge">Nur X-Factor / Superstar</button></div>` : ''}
      <div class="rs-list" id="rsList"></div>
      ${um.length ? `<div class="rs-note">⚠ Auf der NFL-IR, aber nicht im Madden-Kader zuordenbar: ${um.map(x => esc(x.n) + (x.p ? ' (' + esc(x.p) + ')' : '')).join(', ')}</div>` : ''}
      <div class="hint">XF = X-Factor · SS = Superstar · IR = laut NFL auf Injured Reserve (durchgestrichen). Archetyp/Trikotnummer als Tooltip.</div>
    </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#rsClose').onclick = close;

    const list = modal.querySelector('#rsList');
    const sorted = players.slice().sort((a, b) => (b.ovr - a.ovr) || String(a.n).localeCompare(String(b.n)));
    const draw = (f) => {
      const shown = sorted.filter(p => f === 'ir' ? p.ir : f === 'badge' ? p.badge : true);
      list.innerHTML = shown.length ? shown.map(p => {
        const tip = [p.arch, p.num != null ? '#' + p.num : '', p.ir ? 'IR' + (p.irNote ? ' (' + p.irNote + ')' : '') + (p.irTeam ? ' · laut NFL bei ' + p.irTeam : '') : ''].filter(Boolean).join(' · ');
        return `<div class="rs-r${p.ir ? ' ir' : ''}" title="${esc(tip)}"><span class="o${p.ovr >= 90 ? ' h' : p.ovr >= 80 ? ' m' : ''}">${p.ovr}</span><span class="p">${esc(p.pos)}</span><span class="n">${esc(p.n)}</span>${p.badge ? `<span class="b ${p.badge === 'XF' ? 'xf' : 'ss'}">${p.badge}</span>` : ''}${p.ir ? '<span class="b irt">IR</span>' : ''}</div>`;
      }).join('') : `<div class="hint" style="grid-column:1/-1;">${players.length ? 'Keine Einträge für diesen Filter.' : 'Noch kein Kader — „Von Madden Ratings abrufen“ ausführen.'}</div>`;
    };
    draw('all');
    modal.querySelectorAll('.filt button').forEach(b => b.onclick = () => {
      modal.querySelectorAll('.filt button').forEach(x => x.classList.toggle('on', x === b));
      draw(b.dataset.f);
    });
  }
  async function copyFromPreviousYear() {
    const year = parseInt(document.getElementById('ratingsYear').value);
    const prevRatings = await MB.loadTeamRatings(year - 1);
    MB.nflTeams.forEach(t => {
      const el = document.getElementById(`rating-${t.id}`);
      if (el) el.value = prevRatings[t.id] ?? 85;
    });
  }

  async function saveRatingsGrid() {
    const year = document.getElementById('ratingsYear').value;
    const ratings = {};
    MB.nflTeams.forEach(t => { ratings[t.id] = parseInt(document.getElementById(`rating-${t.id}`).value) || 85; });
    try {
      await MB.saveTeamRatings(year, ratings);
      alert(`Team-Werte für ${year} gespeichert.`);
    } catch (e) {
      alert('Speichern fehlgeschlagen: ' + e.message);
    }
  }

  boot();
</script>
