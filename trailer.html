<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; background: radial-gradient(circle at 50% 35%, #1a2a4f, #04070f 70%); overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .6s; }
  .scene.on { opacity: 1; }
  .big { font: 900 220px/0.9 Impact, 'Arial Black', sans-serif; letter-spacing: 6px; color: #c99700; text-shadow: 10px 10px 0 #d50a0a; text-align: center; }
  .cap { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); max-width: 1500px; text-align: center; font: 800 46px/1.2 'Segoe UI', sans-serif; text-shadow: 0 4px 18px #000, 0 0 2px #000; opacity: 0; transition: opacity .3s; z-index: 50; }
  .cap.on { opacity: 1; }
  .cap b { display: block; font: 900 26px/1 Impact, sans-serif; letter-spacing: 4px; color: #ffd23f; margin-bottom: 8px; }
  @keyframes slam { 0% { transform: scale(3); opacity: 0; } 60% { transform: scale(.95); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-12px,8px); } 50% { transform: translate(10px,-6px); } 75% { transform: translate(-6px,4px); } }
  @keyframes walkIn { from { transform: translateX(var(--from)) ; opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes spark { 0% { opacity: 0; transform: translateY(0) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-260px) scale(1.2); } }
  @keyframes pop { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; } 70% { transform: scale(1.08) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  @keyframes holo { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
  .spot { position: absolute; top: -200px; width: 600px; height: 1400px; background: linear-gradient(180deg, rgba(255,230,150,.35), transparent 70%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); }
  .fig { position: absolute; bottom: 120px; width: 190px; height: 320px; animation: walkIn 1s cubic-bezier(.2,.8,.2,1) both; }
  .fig svg { width: 100%; height: 100%; }
  .fig .nm { position: absolute; left: 50%; bottom: -60px; transform: translateX(-50%); font: 900 34px/1 Impact, sans-serif; letter-spacing: 2px; color: #ffd23f; white-space: nowrap; animation: rise .6s .6s both; }
  .booth { position: absolute; bottom: 30px; width: 380px; height: 380px; }
  .booth svg { width: 100%; height: 100%; }
  .card3 { width: 300px; height: 420px; border-radius: 18px; padding: 18px; box-sizing: border-box; background: linear-gradient(120deg, #2b1f55, #13203a 40%, #4b2a7a 60%, #13203a); background-size: 300% 300%; animation: pop .7s both, holo 3s linear infinite alternate; border: 4px solid #b388ff; box-shadow: 0 0 40px rgba(179,136,255,.6); text-align: center; }
  /* iPhone */
  #phoneWrap { position: absolute; left: 700px; top: 150px; width: 430px; height: 880px; transition: transform 1.2s cubic-bezier(.6,0,.3,1); transform-origin: 50% 45%; transform: rotate(-8deg) scale(.92); animation: rise .8s both; }
  #phoneWrap .hand { position: absolute; left: -46px; bottom: 120px; width: 120px; height: 150px; border-radius: 60px 60px 50px 50px; background: #d9a066; box-shadow: inset -10px -8px 0 rgba(0,0,0,.15); z-index: 6; }
  #phoneWrap .hand::before { content: ''; position: absolute; right: -34px; top: 18px; width: 60px; height: 26px; border-radius: 13px; background: #d9a066; box-shadow: 0 34px 0 #d9a066, 0 68px 0 #d9a066; }
  .phone { position: absolute; inset: 0; border-radius: 64px; background: #111; box-shadow: 0 0 0 4px #3a3f4a, 0 30px 80px rgba(0,0,0,.7); }
  .phone .scr { position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; border-radius: 46px; overflow: hidden; background: #0f1116; }
  .phone .notch { position: absolute; left: 50%; top: 30px; width: 120px; height: 32px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 5; }
  .phone iframe { position: absolute; left: 0; top: 0; width: 390px; height: 840px; border: 0; transform-origin: 0 0; background: #0f1116; }
  .mock { position: absolute; inset: 0; padding: 70px 22px 22px; box-sizing: border-box; background: #0f1116; font-size: 20px; }
  .mock .row { background: #1b2130; border: 1px solid #2a3348; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .btnp { display: inline-block; padding: 12px 18px; border-radius: 12px; border: 2px solid #c99700; margin-right: 10px; font-weight: 800; }
  .btnp.on { background: #c99700; color: #0b1328; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 10000; display: flex; gap: 8px; }
  #hud button { padding: 10px 16px; font-weight: 800; border-radius: 10px; border: 0; cursor: pointer; }
  .rec #hud { display: none; }
</style>

async function loadData() {
  try { await MB.Avatar.load(); } catch (e) { /* Zufallsfiguren */ }
  let st = null; try { st = await MB.fetchCloudState(); } catch (e) { st = null; }
  cfg = (st && st.config) || {};
  players = ((st && st.players) || []).map(p => ({ name: p.name, team: p.team }));
  let seasons = []; try { seasons = await MB.loadHistorySeasons(); } catch (e) { seasons = []; }
  if (!players.length && seasons.length) players = (seasons[seasons.length - 1].players || []).map(p => ({ name: p.name, team: p.team }));
  if (!players.length) players = ['Tim', 'Alex', 'Markus', 'Lasse', 'Tobi F.', 'Tobi W.', 'Micha', 'Raffa'].map(n => ({ name: n, team: null }));
  players = players.slice(0, 8);
  const roman = (n) => ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'][n] || String(n);
  title = `ALTIMA BOWL ${roman((seasons.length || 0) + ((st && (st.players || []).length) ? 0 : 1))}`.trim();
  try { songUrl = await MB.getAppConfig('trailer_song'); } catch (e) { songUrl = null; }
}

const voice = {};
async function prepareVoice(info) {
  const t = MB.Announcer.getTtsSettings();
  if (!(t.provider === 'elevenlabs' && t.apiKey)) { info('Ohne ElevenLabs: Enzo erscheint als Untertitel.'); return; }
  let done = 0;
  await Promise.all(LINES.map(async (l, i) => { try { voice[i] = await MB.Announcer.ttsUrl('[booming] ' + l); } catch (e) { voice[i] = null; } info(`Enzos Stimme: ${++done}/${LINES.length}`); }));
}
async function enzo(i) {
  const cap = $('cap'); cap.querySelector('span').textContent = LINES[i]; cap.classList.add('on');
  const bgm = $('bgm'); bgm.volume = 0.15;
  if (voice[i]) { await new Promise(res => { const a = new Audio(voice[i]); a.onended = res; a.onerror = res; a.play().catch(res); }); }
  else await sleep(Math.max(1800, LINES[i].length * 65));
  cap.classList.remove('on'); bgm.volume = 0.45;
}

    <div class="row" id="lb"><b>🏆 Wettbüro</b><div style="margin-top:8px; opacity:.85;">1. ${b.name} – 14 P<br>2. ${a.name} – 12 P<br>3. ${c.name} – 11 P</div></div></div>`;

  await sleep(1200); const tp = mock.querySelector('.tp'); if (tp) tp.classList.add('on');
  await sleep(700); mock.querySelector('.mock').insertAdjacentHTML('beforeend', `<div style="position:absolute; left:50%; bottom:40px; transform:translateX(-50%); background:#22a447; padding:12px 22px; border-radius:12px; font-weight:800; animation: pop .4s both;">✓ Tipp gespeichert</div>`);

    <div class="card3"><div style="font:900 16px/1 Impact; letter-spacing:3px; color:#b388ff;">EPIC</div><div style="font-size:120px; margin:40px 0 20px;">🔥</div><div style="font:900 30px/1 Impact;">ON FIRE</div><div style="opacity:.8; margin-top:10px;">Fünf Siege in Folge.</div></div></div>`;
  const enz8 = enzo(8);
  await sleep(2200);
  mock.innerHTML = `<div class="mock" style="text-align:center;"><div style="font:900 26px/1 Impact; color:#ffd23f;">🎨 EIGENE FIGUR</div><div id="mfig" style="width:300px; height:470px; margin:18px auto 0;">${MB.Avatar.svg(cfgV)}</div><div id="mlab" style="font-weight:800;"></div></div>`;
  await sleep(1300);
  $('mfig').innerHTML = MB.Avatar.svg({ ...cfgV, hat: 'viking', back: 'cape', aura: 'aura' }); $('mfig').style.animation = 'pop .5s both';

  // 11) Musikvideo-Ausschnitt mit dem hochgeladenen Song
  clear(s); $('bgm').pause();

  s = scene(`<div style="position:absolute; left:220px; bottom:0; width:640px; height:900px;">${MB.DraftStage.charSVG('announcer')}</div>`);

  s = scene(bigTitle(title.replace(/ ([IVX]+)$/, '<br><span style="font-size:.6em">$1</span>'), `<div style="font:800 46px/1.2 Segoe UI; margin-top:30px;">${when}</div>

// ---------- Aufnahme
async function startTrailer(record) {
  const info = (t) => { $('hudInfo').textContent = t; };
  info('Lade Daten …'); await loadData();
  if (songUrl) { $('bgm').src = songUrl; $('bgm').volume = 0.45; }
  await prepareVoice(info);
  let rec = null, chunks = [];
  if (record) {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true, preferCurrentTab: true, selfBrowserSurface: 'include' });
      const mime = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
      rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8000000 } : {});
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'video/webm' })); a.download = `altima-bowl-trailer.${ext}`; a.click(); };
      rec.start(500);
    } catch (e) { alert('Aufnahme nicht gestartet: ' + e.message + '\nTipp: diesen Tab auswählen und „Tab-Audio teilen“ aktivieren.'); return; }
  }
  document.body.classList.add('rec');
  if (songUrl) $('bgm').play().catch(() => {});
  await sleep(700);
  try { await run(); } catch (e) { console.error(e); }
  $('bgm').pause();
  if (rec) rec.stop();
  document.body.classList.remove('rec'); info('Fertig.' + (rec ? ' Das Video wird heruntergeladen.' : ''));
}
