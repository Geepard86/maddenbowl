<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Altima Bowl VI — Dashboard</title>
<link rel="icon" type="image/png" href="maddenbowl.ico" />
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared.js"></script>

<script src="blog.js"></script>

<link rel="stylesheet" href="styles.css" />
<style>
  .v2 .v2-wrap { padding-bottom: 14px; }
  /* Team-Übersicht (vor Turnierstart) */
  .tm-slider { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 2px 10px; scrollbar-width:thin; }
  .tm-logo { flex:0 0 auto; scroll-snap-align:start; width:74px; padding:6px 4px 5px; border-radius:10px; border:1px solid var(--v2-border); background:rgba(255,255,255,.03); cursor:pointer; text-align:center; color:inherit; position:relative; }
  .tm-logo img { width:46px; height:46px; object-fit:contain; display:block; margin:0 auto 3px; }
  .tm-logo .tm-n { font-size:.66em; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tm-logo .tm-o { font-size:.62em; color:var(--v2-silver); }
  .tm-logo.active { border-color:var(--v2-gold); background:rgba(201,151,0,.14); }
  .tm-logo.seen::after { content:'✓'; position:absolute; top:3px; right:5px; font-size:.62em; color:var(--v2-gold); }
  .tm-nav { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .tm-nav button { width:auto; margin:0; padding:4px 10px; border-radius:8px; border:1px solid var(--v2-border); background:transparent; color:var(--v2-silver); cursor:pointer; }
  .tm-head { display:flex; align-items:center; gap:12px; margin:6px 0 8px; }
  .tm-head img { width:56px; height:56px; object-fit:contain; }
  .tm-head .t { font-weight:900; font-size:1.05em; }
  .tm-head .s { font-size:.72em; color:var(--v2-silver); }
  .tm-roster { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:3px 14px; max-height:340px; overflow-y:auto; font-size:.8em; }
  .tm-p { display:flex; align-items:center; gap:7px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .tm-p .o { min-width:26px; text-align:center; font-weight:900; border-radius:5px; padding:1px 3px; background:#263449; }
  .tm-p .o.h { background:var(--v2-gold); color:#111; } .tm-p .o.m { background:#3b5a86; }
  .tm-p .pp { min-width:30px; color:var(--v2-silver); font-size:.9em; }
  .tm-p .nn { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tm-p .bb { font-size:.72em; font-weight:900; padding:1px 4px; border-radius:3px; }
  .tm-p .bb.xf { background:#ffd23f; color:#000; } .tm-p .bb.ss { background:#1e50c8; color:#fff; } .tm-p .bb.ir { background:#d50a0a; color:#fff; }
  .tm-p.ir .nn { opacity:.55; text-decoration:line-through; }
  .v2-blog-wide .bw-item { display:block; padding:8px 0; border-top:1px solid rgba(255,255,255,.06); color:inherit; text-decoration:none; }
  .v2-blog-wide .bw-item:first-of-type { border-top:none; }
  .v2-row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; margin-bottom: 10px; }
  .v2-row-2col:last-child { margin-bottom: 0; }
  .v2-row-2col .v2-card { min-width: 0; margin-bottom: 0; }
  @media (max-width: 380px) { .v2-row-2col { grid-template-columns: 1fr; } }
  .v2-card-title a { color: inherit; text-decoration: none; }
  .v2-tab.v2-tab-compact { padding: 7px 10px; font-size: 0.76em; }
  .v2-tabbar.v2-tabbar-compact { margin-bottom: 8px; }
  .v2-game-compact {
    display: grid;
    grid-template-columns: 44px minmax(0,1fr) auto auto auto minmax(0,1fr) minmax(0,60px);
    align-items: center;
    gap: 5px;
    padding: 7px 0;
    cursor: pointer;
    font-size: 0.8em;
    border-bottom: 1px solid var(--v2-border, rgba(255,255,255,0.08));
  }
  .v2-game-compact:last-child { border-bottom: none; }
  .v2-game-compact .v2-live-tag { font-size: 0.68em; padding: 2px 6px; justify-self: start; }
  .v2-game-status { display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); color: var(--v2-silver); padding: 2px 6px; border-radius: 8px; font-weight: 800; font-size: 0.68em; white-space: nowrap; justify-self: start; }
  .v2-game-compact .v2-name-away, .v2-game-compact .v2-name-home { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v2-game-compact .v2-name-away { text-align: right; }
  .v2-game-compact .v2-name-home { text-align: left; }
  .v2-game-compact .v2-at { color: var(--v2-silver); font-size: 0.78em; }
  .v2-game-compact .v2-stadium { text-align: right; color: var(--v2-silver); font-size: 0.68em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v2-game-compact img.logo-img { width: 18px; height: 18px; object-fit: contain; }
  .v2-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .v2-modal { background: var(--v2-surface); border: 1px solid var(--v2-border); border-radius: 14px; padding: 16px; max-width: 380px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
  .v2-modal-close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--v2-silver); font-size: 1.2em; cursor: pointer; line-height: 1; padding: 6px; }
  .skel { height: 12px; border-radius: 6px; margin: 6px 0; background: linear-gradient(90deg, #1c2231 25%, #2a3145 50%, #1c2231 75%); background-size: 200% 100%; animation: v2shimmer 1.3s infinite; }
  @keyframes v2shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body class="v2">

<div class="v2-wrap" id="app">
  <div class="v2-card"><div class="skel" style="width:60%"></div><div class="skel" style="width:90%"></div></div>
  <div class="v2-card"><div class="skel" style="width:50%"></div><div class="skel" style="width:80%"></div></div>
</div>

<div id="gameModalOverlay" class="v2-modal-overlay" onclick="closeGameModal(event)">
  <div class="v2-modal" onclick="event.stopPropagation()">
    <button class="v2-modal-close" onclick="closeGameModal()">✕</button>
    <div id="gameModalBody"></div>
  </div>
</div>

<script>
  MB.UI.mountHeader({ active: 'dashboard' });

  let state = null, history = null, articles = [];

  function linkedTitle(label, href) {
    return `<a href="${href}">${label}</a>`;
  }

  let scheduleMatches = [];

  // Mirrort renderNextGames() aus admin.html: state.matches +
  // state.playoffMatches nach "nicht beendet" filtern, erste 2 = live,
  // nächste 2 = upcoming — kein Uhrzeit-Vergleich nötig/zuverlässig.
  function buildScheduleMatches() {
    const playoffTimes = MB.computePlayoffTimes(state);
    // Kickoff-Zeiten kommen jetzt aus dem LIVE-Zeitplan: sobald für ein Feld
    // das Ergebnis des vorherigen Spiels eingetragen wurde, gilt Kickoff =
    // Ergebnis-Zeitstempel + 5 Min. statt der starren Planzeit.
    const liveSchedule = MB.computeLiveKickoffSchedule(state);
    const getMatchTime = (m) => {
      const live = liveSchedule.byMatchId.get(m.matchId);
      if (live) return live.time;
      return (m.t === 'g') ? MB.getGroupMatchTime(state, m) : (playoffTimes.byId[m.id] || playoffTimes.groupEndTime);
    };

    // BUGFIX (Austragungsort): Stadion (und jetzt auch matchId für den
    // Live-Zeitplan-Lookup) müssen auf dem ORIGINAL-Objekt aus
    // state.matches/state.playoffMatches berechnet werden (Referenz-Lookup
    // über slot.includes()/playoffMatches.indexOf()) — NICHT erst nach dem
    // Spread-Kopieren (`{ ...m, t: 'g' }`), weil die Kopie dann ein anderes
    // Objekt ist und die Referenzsuche immer fehlschlägt. Das führte dazu,
    // dass Gruppenspiele hier immer Stadion 1 und Playoff-Spiele immer
    // Stadion 2 anzeigten. Fix: Index/Stadion/matchId VOR dem Spread
    // ermitteln und direkt mitgeben.
    const allMatches = [
      ...state.matches
        .map((m, idx) => ({ m, idx }))
        .filter(({ m }) => !MB.isFinished(m))
        .map(({ m, idx }) => {
          const slot = state.slots.find(s => s.includes(m));
          const idxInSlot = slot ? slot.indexOf(m) : 0;
          const stadium = idxInSlot === 1 ? state.config.s2 : state.config.s1;
          return { ...m, t: 'g', stadium, matchId: `g-${idx}` };
        }),
      ...state.playoffMatches
        .map((m, idx) => ({ m, idx }))
        .filter(({ m }) => !MB.isFinished(m) && m.p1 && m.p2 && m.p2.id !== -1)
        .map(({ m, idx }) => {
          const stadium = (idx % 2 === 0) ? state.config.s1 : state.config.s2;
          return { ...m, t: 'p', stadium, matchId: `p-${m.id}` };
        }),
    ];

    return allMatches.map(m => {
      const p1 = m.t === 'g' ? state.players[m.p1] : m.p1;
      const p2 = m.t === 'g' ? state.players[m.p2] : m.p2;
      return { p1, p2, stadium: m.stadium, matchId: m.matchId, time: getMatchTime(m), phase: m.phase || (m.t === 'p' ? 'Playoffs' : 'Gruppenphase') };
    }).filter(m => m.p1 && m.p2);
  }

  // "X Min. vor/hinter Zeitplan" fürs Spielplan-Card-Widget.
  function scheduleDriftText() {
    try {
      const live = MB.computeLiveKickoffSchedule(state);
      return MB.formatScheduleDriftText(live.drift, { 1: state.config.s1, 2: state.config.s2 });
    } catch (e) { return ''; }
  }

  function renderSpielplanCard() {
    let matches = [];
    try { matches = buildScheduleMatches(); } catch (e) { console.warn('Spielplan-Daten nicht verfügbar:', e); }

    // Blöcke beibehalten (siehe MB.getLiveAndUpcomingMatchIds): erst wenn beide Spiele des
    // aktuellen Blocks eingetragen sind, rückt der nächste Block nach.
    const blockIds = MB.getLiveAndUpcomingMatchIds(state);
    const live = matches.filter(m => blockIds.live.includes(m.matchId)).map(m => ({ ...m, _live: true }));
    const next = matches.filter(m => blockIds.upcoming.includes(m.matchId)).map(m => ({ ...m, _live: false }));
    scheduleMatches = [...live, ...next];

    const rowsHtml = scheduleMatches.length
      ? scheduleMatches.map((m, i) => `
          <div class="v2-game-compact" onclick="showGameModal(${i})">
            ${m._live
              ? `<span class="v2-live-tag"><span class="v2-live-dot"></span>LIVE</span>`
              : `<span class="v2-game-status">${m.time || '?'}</span>`}
            <span class="v2-name-away">${m.p2.name}</span>
            ${MB.getLogoHtml(m.p2.team)}
            <span class="v2-at">@</span>
            ${MB.getLogoHtml(m.p1.team)}
            <span class="v2-name-home">${m.p1.name}</span>
            <span class="v2-stadium">${m.stadium || ''}</span>
          </div>`).join('')
      : `<div class="v2-empty">Keine Spiele geplant.</div>`;

    const driftText = scheduleDriftText();

    return `
      <div class="v2-card">
        <div class="v2-card-title">${linkedTitle('📅 Spielplan', 'spielplan.html')}</div>
        ${rowsHtml}
      </div>`;
  }

  function showGameModal(idx) {
    const m = scheduleMatches[idx];
    if (!m) return;
    const statusHtml = m._live
      ? `<span class="v2-live-tag"><span class="v2-live-dot"></span>LIVE — Anstoß war ${m.time} Uhr</span>`
      : `<span class="v2-game-meta">Anstoß ${m.time || '?'} Uhr</span>`;
    document.getElementById('gameModalBody').innerHTML = `
      <div class="v2-game-top"><span>${m.phase || ''}</span><span>${m.stadium || ''}</span></div>
      <div class="v2-game-teams">
        <div class="v2-team">${MB.getLogoHtml(m.p2.team)}<span class="v2-team-name">${m.p2.name}</span></div>
        <span class="v2-vs">@</span>
        <div class="v2-team">${MB.getLogoHtml(m.p1.team)}<span class="v2-team-name">${m.p1.name}</span></div>
      </div>
      <div style="margin-top:10px;">${statusHtml}</div>
      ${renderMatchMeta(m.p1.name, m.p2.name, false)}
    `;
    document.getElementById('gameModalOverlay').style.display = 'flex';
  }

  function closeGameModal() {
    document.getElementById('gameModalOverlay').style.display = 'none';
  }

  // Quote/O-U/Titelchance/Insights je Match — 1:1 aus admin.html
  // (dort renderMatchMeta) bzw. spielplan.html übernommen.
  function renderMatchMeta(homeName, awayName, finished) { return MB.renderMatchMeta(state, history, homeName, awayName, finished, { wrapperStyle: 'padding-left:0;', titleTrend: false }); }

  async function renderTippspielCard() {
    const tid = MB.getCurrentTournamentId();
    const me = MB.UI.currentPlayer();
    if (!tid) return `<div class="v2-card"><div class="v2-card-title">${linkedTitle('🏆 Tippspiel', 'wettbuero.html')}</div><div class="v2-empty">Kein aktives Turnier.</div></div>`;
    try {
      const allPicks = await MB.Tipp.fetchAllPicks(tid);
      const ouLines = await MB.Tipp.fetchAllOuLines(tid);
      const standings = MB.Tipp.computeTippStandings(state, allPicks, ouLines);
      const top4 = standings.slice(0, 4);
      const myIdx = standings.findIndex(r => r.name === me);
      let rows = top4.map((r, i) => `
        <div class="v2-lb-row ${r.name === me ? 'me' : ''}">
          <span class="v2-lb-rank">${i + 1}</span><span class="v2-lb-name">${r.name}</span><span class="v2-lb-pts">${r.points} Pkt.</span>
        </div>`).join('');
      if (me && myIdx >= 4) {
        rows += `<div class="v2-lb-row me" style="margin-top:4px;">
          <span class="v2-lb-rank">${myIdx + 1}</span><span class="v2-lb-name">${me} (du)</span><span class="v2-lb-pts">${standings[myIdx].points} Pkt.</span>
        </div>`;
      }
      return `
        <div class="v2-card">
          <div class="v2-card-title">${linkedTitle('🏆 Tippspiel', 'wettbuero.html')}</div>
          ${rows || `<div class="v2-empty">Noch keine Tipps abgegeben.</div>`}
        </div>`;
    } catch (e) {
      console.warn('Tippspiel-Stand laden fehlgeschlagen:', e);
      return `<div class="v2-card"><div class="v2-card-title">${linkedTitle('🏆 Tippspiel', 'wettbuero.html')}</div><div class="v2-empty">Konnte Tippstand nicht laden.</div></div>`;
    }
  }

  function excerpt(text, n) {
    const clean = (text || '').replace(/\[\[(bild:\d+|tabelle)\]\]/g, ' ').replace(/\s+/g, ' ').trim();
    return clean.length > n ? clean.slice(0, n).trim() + '…' : clean;
  }

  function formatArticleDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ', ' +
           d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  function renderBlogCard() {
    if (!articles.length) return `<div class="v2-card"><div class="v2-card-title">${linkedTitle('📰 Blog', 'blog.html')}</div><div class="v2-empty">Noch keine Artikel.</div></div>`;
    const items = articles.slice(0, 2).map(a => `
      <a href="blog.html?post=${encodeURIComponent(a.id)}" style="display:block; margin-bottom:6px; color:inherit; text-decoration:none;">
        <div style="font-weight:800; font-size:0.84em;">${excerpt(a.title, 42)}</div>
        <div style="font-size:0.68em; color:var(--v2-silver); margin-top:2px;">${formatArticleDate(a.created_at)}</div>
      </a>`).join('');
    return `
      <div class="v2-card">
        <div class="v2-card-title">${linkedTitle('📰 Blog', 'blog.html')}</div>
        ${items}
      </div>`;
  }

  // ---------------------------------------------------------------
  // All-Time-Rekorde: schlanke Variante von computeAllTime() aus
  // hall_of_fame.html (nur der Teil, der für die "Neueste Rekorde"-
  // Kachel gebraucht wird — Rendering/Tabelle bleibt dort). Bei
  // Änderungen an der Rekord-Logik in hall_of_fame.html ggf. hier
  // mitziehen.
  // ---------------------------------------------------------------
  function hofNormName(s) { return (s || '').trim(); }

  function hofNormalizeSeason(raw) {
    const t = raw?.tournament || raw;
    const season = Number(raw?.season ?? t?.season);
    const players = Array.isArray(t?.players) ? t.players : [];
    const standings = Array.isArray(t?.standings) ? t.standings : [];
    const matches = Array.isArray(t?.matches) ? t.matches : [];
    const teamToPlayer = new Map();
    players.forEach(p => { const n = hofNormName(p.name); if (n && p.team) teamToPlayer.set(p.team, n); });
    const nm = matches.map(m => {
      const homeTeam = m.homeTeam ?? m.home ?? null;
      const awayTeam = m.awayTeam ?? m.away ?? null;
      const homePlayer = hofNormName(m.homePlayer) || (homeTeam ? (teamToPlayer.get(homeTeam) || null) : null);
      const awayPlayer = hofNormName(m.awayPlayer) || (awayTeam ? (teamToPlayer.get(awayTeam) || null) : null);
      const hs = (m.homeScore ?? m.s1 ?? null), as = (m.awayScore ?? m.s2 ?? null);
      return { stage: (m.stage || 'group'), homePlayer, awayPlayer,
               homeScore: (hs === null ? null : Number(hs)), awayScore: (as === null ? null : Number(as)) };
    });
    const st = standings.map(x => ({ rank: Number(x.rank), name: hofNormName(x.name), points: Number(x.points ?? 0) }))
      .filter(x => x.name && Number.isFinite(x.rank));
    return { season, players, standings: st, matches: nm };
  }

  function hofEnsureAgg(map, name) {
    const n = hofNormName(name);
    if (!n) return null;
    if (!map.has(n)) map.set(n, { name: n, games: 0, wins: 0, championships: 0, pf: 0, pa: 0, points: 0 });
    return map.get(n);
  }

  function hofSeasonPlayerStats(s) {
    const map = new Map();
    s.players.forEach(p => hofEnsureAgg(map, p.name));
    s.standings.forEach(x => hofEnsureAgg(map, x.name));
    s.matches.forEach(m => {
      if (!m.homePlayer || !m.awayPlayer || m.homeScore == null || m.awayScore == null) return;
      const A = hofEnsureAgg(map, m.homePlayer), B = hofEnsureAgg(map, m.awayPlayer);
      A.games++; B.games++;
      A.pf += m.homeScore; A.pa += m.awayScore;
      B.pf += m.awayScore; B.pa += m.homeScore;
      if (m.homeScore > m.awayScore) A.wins++; else B.wins++;
    });
    s.standings.forEach(x => { const a = hofEnsureAgg(map, x.name); a.points += (x.points || 0); if (x.rank === 1) a.championships++; });
    return map;
  }

  // "Tobi F." -> "T.F." (Vorname+Nachname/Initiale -> zusammengezogene Initialen);
  // einzelne, längere Namen wie "Micha" -> "Mic." (erste 3 Buchstaben + Punkt).
  function abbreviatePlayerName(name) {
    const n = (name || '').trim();
    if (!n) return n;
    const parts = n.split(/\s+/).filter(Boolean);
    if (parts.length > 1) return parts.map(p => p.charAt(0).toUpperCase() + '.').join('');
    return n.length > 3 ? n.slice(0, 3) + '' : n;
  }

  function computeAllTimeRecords(seasonsRaw) {
    const seasons = (seasonsRaw || []).map(hofNormalizeSeason).filter(s => Number.isFinite(s.season));
    const all = new Map();
    seasons.forEach(s => {
      hofSeasonPlayerStats(s).forEach(p => {
        const a = hofEnsureAgg(all, p.name);
        a.games += p.games; a.wins += p.wins; a.championships += p.championships;
        a.pf += p.pf; a.pa += p.pa; a.points += p.points;
      });
    });
    const table = [...all.values()];
    // Ewige Tabelle: exakt dieselbe Sortierung wie in hall_of_fame.html
    allTimeTable = [...table].sort((A, B) =>
      (B.championships - A.championships) || (B.points - A.points) ||
      ((B.games ? B.wins / B.games : 0) - (A.games ? A.wins / A.games : 0)) ||
      ((B.pf - B.pa) - (A.pf - A.pa)) || (B.pf - A.pf) || A.name.localeCompare(B.name, 'de'));
    if (!table.length) return [];

    const pickMax = (arr, valFn) => arr.length ? arr.reduce((a, b) => valFn(b) > valFn(a) ? b : a) : null;
    const pickMin = (arr, valFn) => arr.length ? arr.reduce((a, b) => valFn(b) < valFn(a) ? b : a) : null;
    const rec = [];
    const mostTitles = pickMax(table, x => x.championships);
    if (mostTitles) rec.push({ icon: '👑', name: mostTitles.name, value: `${mostTitles.championships} Titel` });
    const mostWins = pickMax(table, x => x.wins);
    if (mostWins) rec.push({ icon: '✅', name: mostWins.name, value: `${mostWins.wins} W.` });
    const ironman = pickMax(table, x => x.games);
    if (ironman) rec.push({ icon: '🧱', name: ironman.name, value: `${ironman.games} G.` });
    const mostLosses = pickMax(table, x => x.games - x.wins);
    if (mostLosses) rec.push({ icon: '📉', name: mostLosses.name, value: `${mostLosses.games - mostLosses.wins} L.` });

    const qualified = table.filter(x => x.games >= 10);
    const bestWinPct = pickMax(qualified, x => x.wins / x.games);
    if (bestWinPct) rec.push({ icon: '📈', name: bestWinPct.name, value: `${(bestWinPct.wins / bestWinPct.games * 100).toFixed(0)}%` });
    const bestOffense = pickMax(qualified, x => x.pf / x.games);
    if (bestOffense) rec.push({ icon: '🎯', name: bestOffense.name, value: `${(bestOffense.pf / bestOffense.games).toFixed(1)}Ø` });
    const bestDefense = pickMin(qualified, x => x.pa / x.games);
    if (bestDefense) rec.push({ icon: '🛡️', name: bestDefense.name, value: `${(bestDefense.pa / bestDefense.games).toFixed(1)}Ø` });
    const topScorer = pickMax(table, x => x.pf);
    if (topScorer) rec.push({ icon: '💰', name: topScorer.name, value: `${topScorer.pf} P.` });

    const allMatches = [];
    seasons.forEach(s => s.matches.forEach(m => {
      if (m.homeScore == null || m.awayScore == null || !m.homePlayer || !m.awayPlayer) return;
      allMatches.push({ ...m, season: s.season });
    }));

    if (allMatches.length) {
      const byTotal = [...allMatches].sort((a, b) => ((b.homeScore + b.awayScore) - (a.homeScore + a.awayScore)));
      const t = byTotal[0];
      rec.push({ icon: '🎆', name: `${abbreviatePlayerName(t.homePlayer)}/${abbreviatePlayerName(t.awayPlayer)}`, value: `${t.homeScore}:${t.awayScore}` });

      const byDiff = [...allMatches].sort((a, b) => Math.abs(b.homeScore - b.awayScore) - Math.abs(a.homeScore - a.awayScore));
      const d = byDiff[0];
      const dWinner = d.homeScore > d.awayScore ? d.homePlayer : d.awayPlayer;
      const dWinnerScore = Math.max(d.homeScore, d.awayScore), dLoserScore = Math.min(d.homeScore, d.awayScore);
      rec.push({ icon: '🧨', name: dWinner, value: `${dWinnerScore}:${dLoserScore}` });

      const pairMap = new Map();
      const keyPair = (a, b) => { const A = hofNormName(a), B = hofNormName(b); return (A < B) ? `${A}|${B}` : `${B}|${A}`; };
      allMatches.forEach(m => {
        const k = keyPair(m.homePlayer, m.awayPlayer);
        if (!pairMap.has(k)) pairMap.set(k, { A: m.homePlayer, B: m.awayPlayer, games: 0 });
        pairMap.get(k).games++;
      });
      const mostPlayed = pickMax([...pairMap.values()], x => x.games);
      if (mostPlayed) rec.push({ icon: '🤝', name: `${abbreviatePlayerName(mostPlayed.A)}/${abbreviatePlayerName(mostPlayed.B)}`, value: `${mostPlayed.games}x` });
    }

    return rec;
  }

  let allTimeRecords = [];
  let allTimeTable = [];
  let hofTab = 'alltime';

  function setHofTab(tab) {
    hofTab = tab;
    render({ randomizeHofTab: false });
  }

  function pickRandomRecords(pool, n) {
    const shuffled = [...pool];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, n);
  }

  function renderHallOfFameCard(randomizeTab) {
    if (!history || !history.ringsByPlayer || !history.ringsByPlayer.size) {
      return `<div class="v2-card"><div class="v2-card-title">${linkedTitle('👑 Hall of Fame', 'hall_of_fame.html')}</div><div class="v2-empty">Noch keine abgeschlossene Saison.</div></div>`;
    }
    if (randomizeTab) hofTab = Math.random() < 0.5 ? 'alltime' : 'records';

    const medals = ['🥇', '🥈', '🥉'];
    const row = (p, rank, icon) => `
      <div class="v2-lb-row">
        <span class="v2-lb-rank">${icon}</span><span class="v2-lb-name">${p.name}</span><span class="v2-lb-pts">${p.championships ? p.championships + ' 🏆 · ' : ''}${p.points} P</span>
      </div>`;
    const top3 = allTimeTable.slice(0, 3);
    const last = allTimeTable.length > 3 ? allTimeTable[allTimeTable.length - 1] : null;
    const tableHtml = top3.map((p, i) => row(p, i + 1, medals[i])).join('') +
      (last ? `${allTimeTable.length > 4 ? '<div class="v2-lb-row" style="justify-content:center; opacity:.5; padding:0;">⋯</div>' : ''}${row(last, allTimeTable.length, '💩')}` : '');

    const recordsHtml = allTimeRecords.length
      ? pickRandomRecords(allTimeRecords, 4).map(r => `
          <div class="v2-lb-row">
            <span class="v2-lb-rank">${r.icon}</span>
            <span class="v2-lb-name" style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${r.name}</span>
            <span class="v2-lb-pts" style="white-space:nowrap;">${r.value}</span>
          </div>`).join('')
      : `<div class="v2-empty">Noch keine Rekorde berechenbar.</div>`;

    return `
      <div class="v2-card">
        <div class="v2-card-title">${linkedTitle('👑 Hall of Fame', 'hall_of_fame.html')}</div>
        <div class="v2-tabbar v2-tabbar-compact">
          <button class="v2-tab v2-tab-compact ${hofTab === 'alltime' ? 'active' : ''}" onclick="setHofTab('alltime')">Tabelle</button>
          <button class="v2-tab v2-tab-compact ${hofTab === 'records' ? 'active' : ''}" onclick="setHofTab('records')">Rekorde</button>
        </div>
        ${hofTab === 'alltime' ? tableHtml : recordsHtml}
      </div>`;
  }

  function renderMerchCard() {
    const products = MB.Shop.getFeaturedProducts(1);
    return `
      <div class="v2-card">
        <div class="v2-card-title">${linkedTitle('🛍️ Merch', 'shop.html')}</div>
        <div class="v2-merch-grid">${products.map(MB.Shop.renderProductCardHtml).join('')}</div>
      </div>`;
  }

  // ---------------------------------------------------------------
  // VOR TURNIERSTART: Team-Übersicht (Slider über alle Logos + Kader),
  // Blog mit Saisonrückblicken über die volle Breite, Hall of Fame + Shop.
  // ---------------------------------------------------------------
  let tmTeam = null, tmRosters = null, tmYear = null;
  const tmSeen = new Set(JSON.parse(localStorage.getItem('mb_teams_seen') || '[]'));
  const tmEsc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function tmTeams() {
    const ratings = MB.getTeamRatingsSync(tmYear) || {};
    return MB.nflTeams.map(t => ({ ...t, ovr: Number(ratings[t.id]) || (tmRosters && tmRosters[t.id] && tmRosters[t.id].team_ovr) || null }))
      .sort((a, b) => (b.ovr || 0) - (a.ovr || 0) || a.n.localeCompare(b.n));
  }
  function selectTeam(id, scroll) {
    tmTeam = id;
    tmSeen.add(id); localStorage.setItem('mb_teams_seen', JSON.stringify([...tmSeen]));
    MB.UI.withAchievements(A => A.track('team_view', { team: id, total: MB.nflTeams.length }));
    const box = document.getElementById('tmBox'); if (box) box.outerHTML = renderTeamCard();
    if (scroll) { const el = document.querySelector(`.tm-logo[data-team="${id}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); }
  }
  function stepTeam(d) {
    const list = tmTeams(); const i = Math.max(0, list.findIndex(t => t.id === tmTeam));
    selectTeam(list[(i + d + list.length) % list.length].id, true);
  }
  function renderTeamCard() {
    const list = tmTeams();
    if (!tmTeam) tmTeam = list[0] && list[0].id;
    const t = list.find(x => x.id === tmTeam) || list[0];
    const row = tmRosters && tmRosters[t.id];
    const players = ((row && row.players) || []).slice().sort((a, b) => (b.ovr - a.ovr) || String(a.n).localeCompare(String(b.n)));
    const logos = list.map(x => `<button class="tm-logo ${x.id === t.id ? 'active' : ''} ${tmSeen.has(x.id) ? 'seen' : ''}" data-team="${x.id}" onclick="selectTeam('${x.id}')">
        <img src="https://static.www.nfl.com/t_q-best/league/api/clubs/logos/${x.id}.png" alt="" loading="lazy"><div class="tm-n">${tmEsc(x.n)}</div><div class="tm-o">${x.ovr ? 'OVR ' + x.ovr : '–'}</div></button>`).join('');
    const roster = players.length
      ? `<div class="tm-roster">${players.map(p => `<div class="tm-p ${p.ir ? 'ir' : ''}"><span class="o ${p.ovr >= 90 ? 'h' : p.ovr >= 80 ? 'm' : ''}">${p.ovr}</span><span class="pp">${tmEsc(p.pos)}</span><span class="nn">${tmEsc(p.n)}</span>${p.badge ? `<span class="bb ${p.badge === 'XF' ? 'xf' : 'ss'}">${p.badge}</span>` : ''}${p.ir ? '<span class="bb ir">IR</span>' : ''}</div>`).join('')}</div>`
      : `<div class="v2-empty">Für dieses Team ist noch kein Kader hinterlegt.</div>`;
    const irCount = players.filter(p => p.ir).length;
    return `<div class="v2-card" id="tmBox">
        <div class="v2-card-title">🏈 Teams &amp; Kader ${tmYear ? `<span style="font-weight:600; opacity:.6; font-size:.8em;">Madden ${tmEsc(row && row.madden_version || tmYear)}</span>` : ''}</div>
        <div class="tm-nav"><button onclick="stepTeam(-1)" aria-label="Vorheriges Team">‹</button><span style="font-size:.72em; color:var(--v2-silver); flex:1;">Nach Team-OVR sortiert · ${tmSeen.size}/${MB.nflTeams.length} angeschaut</span><button onclick="stepTeam(1)" aria-label="Nächstes Team">›</button></div>
        <div class="tm-slider">${logos}</div>
        <div class="tm-head"><img src="https://static.www.nfl.com/t_q-best/league/api/clubs/logos/${t.id}.png" alt=""><div><div class="t">${tmEsc(t.n)}${t.ovr ? ` · OVR ${t.ovr}` : ''}</div><div class="s">${players.length ? `${players.length} Spieler${irCount ? ' · ' + irCount + ' auf IR' : ''}` : ''}</div></div></div>
        ${roster}
      </div>`;
  }
  function renderBlogWideCard() {
    const retro = articles.filter(a => a.kind === 'retrospective');
    const list = (retro.length ? retro : articles).slice(0, 4);
    if (!list.length) return `<div class="v2-card"><div class="v2-card-title">${linkedTitle('📰 Blog', 'blog.html')}</div><div class="v2-empty">Noch keine Artikel.</div></div>`;
    return `<div class="v2-card v2-blog-wide"><div class="v2-card-title">${linkedTitle(retro.length ? '📚 Saisonrückblicke' : '📰 Blog', 'blog.html')}</div>
      ${list.map(a => `<a class="bw-item" href="blog.html?post=${encodeURIComponent(a.id)}">
        <div style="font-weight:800; font-size:0.88em;">${a.title || ''}</div>
        <div style="font-size:0.8em; opacity:.8; margin-top:3px;">${excerpt(a.body, 180)}</div>
        <div style="font-size:0.68em; color:var(--v2-silver); margin-top:3px;">${formatArticleDate(a.created_at)}</div></a>`).join('')}</div>`;
  }

  async function render(opts = {}) {
    const randomizeHofTab = opts.randomizeHofTab !== false;
    const app = document.getElementById('app');
    if (!state.players || !state.players.length) {
      if (!tmRosters) {
        tmYear = (state.config && state.config.year) || String(new Date().getFullYear());
        try { tmRosters = await MB.Rosters.loadRostersForYear(tmYear); } catch (e) { tmRosters = {}; }
        if (!Object.keys(tmRosters).length) { try { tmYear = String(Number(tmYear) - 1); tmRosters = await MB.Rosters.loadRostersForYear(tmYear); } catch (e) { tmRosters = {}; } }
        try { await MB.loadTeamRatings(tmYear); } catch (e) { /* optional */ }
      }
      app.innerHTML = `
        ${renderTeamCard()}
        ${renderBlogWideCard()}
        <div class="v2-row-2col">
          ${renderHallOfFameCard(randomizeHofTab)}
          ${renderMerchCard()}
        </div>`;
      return;
    }
    app.innerHTML = `
      ${renderSpielplanCard()}
      <div class="v2-row-2col">
        ${await renderTippspielCard()}
        ${renderBlogCard()}
      </div>
      <div class="v2-row-2col">
        ${renderHallOfFameCard(randomizeHofTab)}
        ${renderMerchCard()}
      </div>
    `;
  }

  async function boot() {
    try {
      state = await MB.fetchCloudState();
    } catch (e) {
      document.getElementById('app').innerHTML = `<div class="v2-card">Konnte Turnierdaten nicht laden. (${e.message})</div>`;
      return;
    }
    MB.UI.setState(state, () => render());
    try { history = await MB.loadAndBuildHistory(); } catch (e) { console.warn('History laden fehlgeschlagen:', e); }
    try {
      const rawSeasons = await MB.loadHistorySeasons();
      allTimeRecords = computeAllTimeRecords(rawSeasons);
    } catch (e) { console.warn('All-Time-Rekorde laden fehlgeschlagen:', e); }
    try { await MB.loadTeamRatings(state.config?.year || '2026'); } catch (e) {}
    try {
      articles = await MB.Blog.fetchAllArticles(40);
    } catch (e) { console.warn('Artikel laden fehlgeschlagen:', e); }

    await render();

    setInterval(async () => {
      try {
        const hadPlayers = !!(state.players && state.players.length);
        state = await MB.fetchCloudState();
        MB.UI.setState(state);
        articles = await MB.Blog.fetchAllArticles(40);
        // Ohne laufendes Turnier nicht ständig neu zeichnen (Team-Slider würde zurückspringen)
        if (!hadPlayers && !(state.players && state.players.length)) return;
        await render();
      } catch (e) { console.warn('Auto-Refresh fehlgeschlagen:', e); }
    }, 15000);
  }

  boot();
</script>
</body>
</html>
